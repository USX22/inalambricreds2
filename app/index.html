<meta charset="utf-8">
<title>Laboratorio InnovaLogistics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: consola de laboratorio. Barra superior fija con cuenta regresiva, navegación por pestañas,
   lecciones en dos columnas (lista de "puertos" + contenido). Progreso = LEDs de puertos de switch. */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --surface-2:#E8EEF0; --ink:#132029; --muted:#55666F; --line:#D3DDE1;
  --accent:#0B6E78; --accent-ink:#FFFFFF; --accent-soft:#DCEEF0;
  --led-on:#1E9E57; --led-mid:#D49800; --led-off:#B6C2C7;
  --bad:#B93A26; --bad-soft:#F8E2DD; --good:#1B7F47; --good-soft:#DFF2E7; --warn-soft:#FAEFD3;
  --code-bg:#0F1A20; --code-ink:#D6E6EA; --code-dim:#7F98A1;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1317; --surface:#141F25; --surface-2:#1B2830; --ink:#E2EBEE; --muted:#93A5AD; --line:#26363F;
  --accent:#43B7C2; --accent-ink:#05262A; --accent-soft:#12323A;
  --led-on:#34C474; --led-mid:#E9B124; --led-off:#3A4A52;
  --bad:#F07C68; --bad-soft:#3A201B; --good:#5FD394; --good-soft:#14301F; --warn-soft:#382E13;
  --code-bg:#070E12; --code-ink:#CFE2E7; --code-dim:#6E8790; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C1317; --surface:#141F25; --surface-2:#1B2830; --ink:#E2EBEE; --muted:#93A5AD; --line:#26363F;
  --accent:#43B7C2; --accent-ink:#05262A; --accent-soft:#12323A;
  --led-on:#34C474; --led-mid:#E9B124; --led-off:#3A4A52;
  --bad:#F07C68; --bad-soft:#3A201B; --good:#5FD394; --good-soft:#14301F; --warn-soft:#382E13;
  --code-bg:#070E12; --code-ink:#CFE2E7; --code-dim:#6E8790; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2.1rem;letter-spacing:.01em}
h2{font-size:1.55rem}
h3{font-size:1.2rem}
p{margin:0}
code,kbd{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);padding:.08em .35em;border-radius:4px;overflow-wrap:anywhere}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-size:1.25rem;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:.8rem}
.chip{font-family:var(--f-mono);font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.hot{border-color:var(--bad);color:var(--bad)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-top:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;padding-block:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
@media (max-width:640px){.brand span{display:none}.brand b{font-size:1.05rem}.top .wrap{gap:8px;padding-block:6px}nav.tabs a{padding:8px 10px;font-size:.92rem}.chip{font-size:.72rem}}

main{padding-block:24px 64px}
.stack{display:flex;flex-direction:column;gap:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:8px 14px;font-weight:600;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:stretch}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.count{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;margin-block:10px 6px}
.count .n{font-family:var(--f-display);font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.count .u{color:var(--muted);font-size:.85rem;margin-left:4px}

/* Panel de switch (progreso) */
.faceplate{background:var(--code-bg);border-radius:10px;padding:16px;color:var(--code-ink)}
.faceplate .lbl{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;color:var(--code-dim);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ports{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px;margin-block:12px}
.port{background:#1E2B32;border:1px solid #33444D;border-radius:4px;padding:6px 2px 4px;text-align:center;color:#AFC4CB;font-family:var(--f-mono);font-size:.72rem;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.port:hover{border-color:var(--accent)}
@media (max-width:520px){.ports{grid-template-columns:repeat(6,minmax(0,1fr))}}
.led{width:9px;height:9px;border-radius:50%;background:var(--led-off);display:inline-block;flex:none}
.led.on{background:var(--led-on);box-shadow:0 0 6px var(--led-on)}
.led.mid{background:var(--led-mid);box-shadow:0 0 6px var(--led-mid)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--code-dim);font-family:var(--f-mono)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Calendario */
.days{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding-block:12px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .d{font-family:var(--f-display);font-size:1.05rem}
.day.today .d{color:var(--accent)}
.day.today{background:linear-gradient(90deg,var(--accent-soft),transparent);border-radius:6px;padding-inline:8px}
.day ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.day li a{display:inline-flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink)}
.day li a:hover{color:var(--accent)}
.deadline{font-weight:600;color:var(--bad)}

/* Lección */
.lesson > *{min-width:0}
.lesson{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.lesson{grid-template-columns:minmax(0,1fr)}.side{position:static!important;max-height:none!important}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);max-height:calc(100vh - 140px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.side h4{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:12px 8px 4px}
.side h4:first-child{margin-top:4px}
.side a{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:.9rem}
.side a .num{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);width:20px}
.side a.cur{background:var(--accent-soft);font-weight:600}
.side details summary{cursor:pointer;font-weight:600;padding:4px 8px}
@media (min-width:901px){.side details summary{display:none}}

.lhead{display:flex;flex-direction:column;gap:8px}
.pbar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--led-on);transition:width .3s}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.why > div{border-left:3px solid var(--accent);padding:4px 12px;background:var(--surface);border-radius:0 8px 8px 0}
.why > div.rub{border-left-color:var(--led-mid)}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sec > h3{display:flex;align-items:center;gap:10px}
.sec > h3 .tag{font-family:var(--f-mono);font-size:.7rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;background:var(--surface-2);color:var(--muted);padding:2px 8px;border-radius:4px}
.prose{display:flex;flex-direction:column;gap:12px;max-width:72ch}
.prose ul,.prose ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.analogy{background:var(--warn-soft);border-radius:8px;padding:12px 14px}
.analogy::before{content:"Piénsalo así";display:block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.tbl{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;background:var(--surface-2)}
td.mono,th.mono{font-family:var(--f-mono);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:8px}
.steps li.ok{background:var(--good-soft);border-color:transparent}
.steps input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--led-on)}
.steps .body{display:flex;flex-direction:column;gap:8px;min-width:0}

pre.code{background:var(--code-bg);color:var(--code-ink);font:13px/1.55 var(--f-mono);padding:14px;border-radius:8px;overflow:auto;margin:0;max-height:440px;white-space:pre}
.codebox{position:relative;min-width:0}
.codebox .btn{position:absolute;top:8px;right:8px}
.cmt{color:var(--code-dim)}

.verify td:first-child{font-family:var(--f-mono);font-size:.85rem}
.q{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:8px 12px}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.exp{font-size:.9rem;padding:8px 12px;border-radius:6px}
.exp.right{background:var(--good-soft)}
.exp.wrong{background:var(--bad-soft)}
.say{font-size:1.05rem;border-left:3px solid var(--accent);padding:6px 14px;font-style:italic}
.links{display:flex;flex-direction:column;gap:6px}
.links a{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;text-decoration:none;color:var(--ink);padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.links a b{color:var(--accent)}
textarea{width:100%;min-height:90px;font:inherit;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--ink)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Topología */
.topo{width:100%;min-width:620px;height:auto;display:block}
.topo .zone{fill:var(--surface-2);stroke:none}
.topo .zl{font:600 11px var(--f-mono);fill:var(--muted);letter-spacing:.08em}
.topo .e{stroke:var(--line);stroke-width:2;fill:none}
.topo .e.dash{stroke-dasharray:5 5}
.topo .e.hi{stroke:var(--accent);stroke-width:3}
.topo .n rect{fill:var(--surface);stroke:var(--muted);stroke-width:1.2}
.topo .n text{font:500 12px var(--f-body);fill:var(--ink)}
.topo .n.hi rect{fill:var(--accent);stroke:var(--accent)}
.topo .n.hi text{fill:var(--accent-ink);font-weight:600}
.topo.dim .n:not(.hi){opacity:.45}
.topobox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto}
.topobox .cap{font-size:.8rem;color:var(--muted);padding:2px 6px 6px}

/* Herramientas */
.subnav{display:flex;gap:6px;flex-wrap:wrap}
.subnav button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px}
.subnav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--muted)}
.field input,.field select{font:15px var(--f-mono);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:100%}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 16px;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.subgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
@media (max-width:560px){.subgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sub{border:1px solid var(--line);border-radius:6px;padding:6px;font-size:.72rem;font-family:var(--f-mono);background:var(--surface);color:var(--ink);text-align:left}
.sub b{display:block;font-size:.78rem}
.sub.used{background:var(--accent-soft);border-color:var(--accent)}
.acl{font-family:var(--f-mono);font-size:.85rem;display:flex;flex-direction:column;gap:3px}
.acl div{padding:5px 10px;border-radius:5px;border:1px solid transparent;overflow-wrap:anywhere}
.acl div.chk{opacity:.55}
.acl div.hit.permit{background:var(--good-soft);border-color:var(--good);opacity:1}
.acl div.hit.deny{background:var(--bad-soft);border-color:var(--bad);opacity:1}
.verdict{font-weight:600;padding:10px 14px;border-radius:8px}
.verdict.permit{background:var(--good-soft);color:var(--good)}
.verdict.deny{background:var(--bad-soft);color:var(--bad)}
.verdict.na{background:var(--warn-soft)}
.journey{display:flex;flex-direction:column;gap:12px}
.jstep{font-size:1rem;min-height:4.5em}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--led-off)}
.dots i.on{background:var(--accent)}
.flash{min-height:220px;display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.flash .fq{font-family:var(--f-display);font-size:1.45rem;line-height:1.25}
.timer{font-family:var(--f-display);font-size:3.4rem;font-variant-numeric:tabular-nums;line-height:1}
.segs{display:flex;flex-direction:column;gap:4px}
.seg{display:grid;grid-template-columns:52px minmax(0,1fr) 48px;gap:10px;padding:6px 10px;border-radius:6px;font-size:.92rem;align-items:center}
.seg .t{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.seg.cur{background:var(--accent-soft);font-weight:600}
.seg.past{color:var(--muted)}
.crit{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:14px;align-items:center;padding-block:14px;border-top:1px solid var(--line)}
.crit:first-child{border-top:0}
.crit .pts{font-family:var(--f-display);font-size:1.5rem;text-align:right;font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--led-on)}
.chan{width:100%;height:auto}
.chan text{font:11px var(--f-mono);fill:var(--muted)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;border-bottom:1.5px dotted var(--accent);cursor:help}
.term:hover{color:var(--accent)}
#gloss-pop{position:fixed;z-index:20;background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:.9rem;display:flex;flex-direction:column;gap:4px}
#gloss-pop b{font-family:var(--f-display);font-size:1.05rem}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.glist div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.ptwin{width:100%;min-width:560px;height:auto}
.ptwin text{font:12px var(--f-body);fill:var(--ink)}
.ptwin .lb{font:600 12px var(--f-body);fill:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><b>Laboratorio InnovaLogistics</b><span>Proyecto integrador · Redes inalámbricas</span></div>
    <span class="chip" id="cd">—</span>
  </div>
  <nav class="tabs" aria-label="Secciones"><div class="wrap">
    <a href="#ruta" data-tab="ruta">Mi ruta</a>
    <a href="#leccion-fundamentos" data-tab="leccion">Lecciones</a>
    <a href="#herramientas" data-tab="herramientas">Herramientas</a>
    <a href="#defensa" data-tab="defensa">Defensa (20 min)</a>
    <a href="#rubrica" data-tab="rubrica">Rúbrica y entrega</a>
  </div></nav>
</header>
<main class="wrap" id="main"></main>
<div id="gloss-pop" role="dialog" aria-live="polite" hidden></div>

<script>
/* =====================================================================
   DATOS DEL PROYECTO
   ===================================================================== */
const DEADLINE = new Date('2026-11-13T12:00:00-06:00'); // Puebla (UTC-6)

const NODES = {
  cel:{x:80,y:70,l:'Celulares 4G'}, tower:{x:220,y:70,l:'Torre 4G'}, co:{x:360,y:70,l:'Central Office'}, r:{x:510,y:70,l:'R-CORE'},
  wlc:{x:390,y:150,l:'WLC'}, cli:{x:95,y:205,l:'Laptops / Tablet'}, ap1:{x:270,y:205,l:'AP-1'}, swc:{x:510,y:205,l:'SW-CORE'},
  adm:{x:110,y:330,l:'PC-ADMIN'}, rad:{x:255,y:330,l:'RADIUS'}, iot:{x:385,y:330,l:'Servidor IoT'}, cen:{x:535,y:330,l:'Servidor Central'},
  swa:{x:725,y:245,l:'SW-ALMACEN'}, ap2:{x:665,y:350,l:'AP-2'}, ap3:{x:790,y:350,l:'AP-3'}, sens:{x:728,y:440,l:'Sensores IoT'}
};
const EDGES = [['cel','tower',1],['tower','co'],['co','r'],['r','swc'],['swc','wlc'],['swc','ap1'],['ap1','cli',1],
  ['swc','adm'],['swc','rad'],['swc','iot'],['swc','cen'],['swc','swa'],['swa','ap2'],['swa','ap3'],['ap2','sens',1],['ap3','sens',1]];

function topo(focus, caption){
  focus = focus || [];
  const f = new Set(focus);
  let s = `<svg class="topo${focus.length?' dim':''}" viewBox="0 0 860 470" role="img" aria-label="Topología de la red${focus.length?'; resaltado: '+focus.map(k=>NODES[k].l).join(', '):''}">`;
  s += `<rect class="zone" x="12" y="30" width="430" height="78" rx="8"/><text class="zl" x="22" y="46">FLOTILLA · RED 4G</text>`;
  s += `<rect class="zone" x="12" y="122" width="600" height="240" rx="8"/><text class="zl" x="22" y="138">EDIFICIO OFICINAS</text>`;
  s += `<rect class="zone" x="622" y="205" width="228" height="258" rx="8"/><text class="zl" x="632" y="221">ALMACÉN</text>`;
  EDGES.forEach(([a,b,d])=>{ const A=NODES[a],B=NODES[b]; const hi=f.has(a)&&f.has(b);

<p>Una <b>red</b> es un grupo de equipos que intercambian información. En este proyecto hay cinco tipos: <b>LAN</b> (red local cableada), <b>WLAN</b> (red local inalámbrica, el WiFi), <b>WAN</b> (redes grandes, Internet), <b>WWAN</b> (inalámbrica de área amplia: la red celular 4G) y <b>WSN</b> (red de sensores inalámbricos).</p>
<h3>IP, máscara y gateway</h3>
<p>La <b>dirección IP</b> identifica a un equipo en la red, por ejemplo <code>192.168.1.15</code>. Son 4 números de 0 a 255 (32 bits).</p>
<p>La <b>máscara</b> separa la IP en dos partes: la <b>red</b> y el <b>host</b>. Con <code>/24</code> (255.255.255.0), los primeros tres números son la red y el último es el equipo: <code>192.168.1.15/24</code> está en la red <code>192.168.1.0</code> y es el host 15.</p>
<div class="analogy">La red es la colonia y el host es el número de casa. Dos casas de la misma colonia se visitan caminando (switch). Para ir a otra colonia necesitas al cartero (router). El <b>gateway</b> es ese cartero: la dirección del router de tu red.</div>
<p>En cada red, la primera dirección (<code>.0</code>) nombra a la red y la última (<code>.255</code>) es el <b>broadcast</b> ("mensaje para todos"). Por eso en una /24 caben <b>254</b> equipos.</p>
<h3>Switch y router</h3>
<ul><li><b>Switch (capa 2):</b> une equipos de la <b>misma red</b>. Usa direcciones <b>MAC</b> (el número de serie de la tarjeta de red).</li>
<li><b>Router (capa 3):</b> une <b>redes distintas</b>. Usa direcciones <b>IP</b> y una tabla de rutas.</li></ul>

<div class="tbl"><table><thead><tr><th>Capa</th><th>Qué maneja</th><th>En tu proyecto</th></tr></thead><tbody>

<tr><td>4 Transporte</td><td>Puertos TCP/UDP</td><td>RADIUS 1812, CAPWAP 5246/5247</td></tr>
<tr><td>7 Aplicación</td><td>Servicios</td><td>DHCP, DNS, HTTP, RADIUS</td></tr></tbody></table></div>
<h3>Puertos</h3>
<p>La IP lleva el paquete a la computadora; el <b>puerto</b> lo lleva al programa. <b>TCP</b> confirma la entrega (web, SSH). <b>UDP</b> es más rápido y no confirma (DHCP, DNS, RADIUS, CAPWAP).</p>
<h3>La línea de comandos de Cisco</h3>
<p><code>Router&gt;</code> (solo ver) → <code>enable</code> → <code>Router#</code> (ver todo y guardar) → <code>configure terminal</code> → <code>Router(config)#</code> (configurar). <code>exit</code> sube un nivel, <code>end</code> regresa a <code>#</code>, <code>write memory</code> guarda. La tecla <kbd>Tab</kbd> autocompleta y <kbd>?</kbd> muestra opciones.</p>

 prob:'Antes de configurar nada necesitas poder explicar qué problema resuelve cada equipo. El docente evalúa que justifiques la solución.',
 rub:'Documentación y sustentación (10 %) y la lógica de todos los demás',
 theory:`
<p>InnovaLogistics distribuye insumos médicos e industriales en el Parque Industrial Chachapa, Puebla. Tiene <b>Oficinas Corporativas</b>, un <b>Almacén Central</b> y una <b>flotilla</b> en ruta.</p>
<h3>Cuatro problemas, cuatro soluciones</h3>
<div class="tbl"><table><thead><tr><th>Problema</th><th>Por qué pasa</th><th>Tu solución</th></tr></thead><tbody>
<tr><td>WiFi saturado, caídas, sin cobertura, fuga de información</td><td>Routers caseros independientes, todos en el mismo canal de 2.4 GHz, y una sola clave para todos</td><td><b>WLC + 3 APs</b> coordinados en canales 1/6/11, mismo SSID (ESS) con roaming, y <b>WPA2-Enterprise</b> con usuario propio por empleado</td></tr>
<tr><td>Visitantes en la misma red que los servidores</td><td>Una sola red plana</td><td>SSID de invitados en <b>VLAN 20</b> + <b>ACL</b> que bloquea toda la red interna</td></tr>
<tr><td>Sin monitoreo de temperatura ni humo</td><td>No hay sensores</td><td><b>Sensores IoT</b> + servidor IoT con reglas automáticas (ventilador, sirena)</td></tr>
<tr><td>Flotilla desconectada</td><td>El WiFi no llega a la calle</td><td><b>Torre celular 4G</b> + Central Office conectado al router, con ACL que solo deja llegar al portal de entregas</td></tr>
</tbody></table></div>
<h3>Cómo leer el mapa</h3>
<ol><li><b>R-CORE</b> está en el centro: conecta todas las redes (VLANs y red celular).</li>
<li>Del router sale un cable al <b>SW-CORE</b> (oficinas): ahí están la WLC, el AP-1, los 3 servidores y la PC de administración.</li>
<li>Del SW-CORE sale un cable al <b>SW-ALMACEN</b>, con el AP-2 y el AP-3.</li>
<li>Por WiFi se conectan laptops, tablet y sensores.</li>
<li>Por otro puerto del router están el <b>Central Office</b> y la <b>torre 4G</b>, donde se conectan los celulares.</li></ol>
<h3>Lo que te van a evaluar</h3>
<div class="tbl"><table><thead><tr><th>Criterio</th><th>Peso</th><th>Lecciones que lo cubren</th></tr></thead><tbody>
<tr><td>Infraestructura base (VLANs, trunks, inter-VLAN, DHCP, subneteo)</td><td class="mono">20 %</td><td>3 a 8</td></tr>
<tr><td>WLC, LAPs en CAPWAP, SSIDs y roaming sin pérdida</td><td class="mono">25 %</td><td>9 a 11</td></tr>
<tr><td>WPA2-Enterprise + RADIUS e invitados aislados por ACL</td><td class="mono">25 %</td><td>12 y 13</td></tr>
<tr><td>IoT con reglas automáticas y red 4G</td><td class="mono">20 %</td><td>14 y 15</td></tr>
<tr><td>Reporte (topología, tabla de direccionamiento) y defensa ante pruebas de falla</td><td class="mono">10 %</td><td>16 a 18</td></tr>
</tbody></table></div>
<p>Tienes que entregar tres evidencias: <b>reporte</b>, <b>archivo .pkt</b> y <b>presentación</b>. Expones el <b>13 de noviembre a las 12:00</b> y tienes <b>20 minutos</b>.</p>`,
 steps:[
  {t:'Lee el PDF del proyecto completo una vez, con calma. Subraya las palabras: WLC, 3 Access Points, ESS, Roaming, WPA2-Enterprise, 802.1X, RADIUS, VLAN, Invitados, IoT, Torre Celular, 192.168.0.0/20.'},
  {t:'Mira el mapa de arriba (la topología). En una hoja, <b>dibújalo de memoria</b> con los 16 bloques. Compara y corrige.'},
  {t:'Explica en voz alta, en 1 minuto, qué hace cada uno de los 4 pilares (WLC, seguridad, IoT, 4G) y qué problema resuelve.'},
  {t:'Revisa la tabla de la rúbrica: identifica que WLC (25 %) y Seguridad (25 %) valen la mitad de la calificación. Ahí pondrás más cuidado.'}
 ],
 verify:[['¿Puedes dibujar la topología sin ver?','Sí, con los 3 APs, 2 switches, WLC, 3 servidores y la parte 4G'],['¿Puedes decir qué problema resuelve cada pilar?','Sí, en una frase cada uno']],
 quiz:[
  {q:'¿Qué parte del diseño resuelve que los visitantes vean los servidores?', o:['Los canales 1, 6 y 11','La VLAN 20 con su ACL','El servidor IoT','La torre celular'], a:1, e:'Los visitantes quedan en su propia VLAN y una ACL en el router bloquea todo lo que vaya hacia la red interna.'},
  {q:'¿Por qué se cambian los routers caseros por una WLC con APs ligeros?', o:['Porque son más baratos','Para controlar todos los APs desde un punto: canales, SSIDs, seguridad y roaming','Porque los routers no tienen WiFi','Para usar 4G'], a:1, e:'La WLC centraliza la configuración y coordina a los APs. Los routers caseros eran redes aisladas en el mismo canal.'},
  {q:'¿Qué dos criterios pesan más en la rúbrica?', o:['Infraestructura base y Documentación','WLC/roaming y Seguridad','IoT y Documentación','Infraestructura base e IoT'], a:1, e:'WLC/WLANs/roaming (25 %) y Seguridad (25 %) suman la mitad de la calificación.'}
 ],
 say:'Nuestra solución tiene cuatro pilares: una WLC con tres APs para cobertura y roaming, WPA2-Enterprise con RADIUS más una VLAN aislada para invitados, una red de sensores IoT con reglas automáticas, y conectividad 4G para la flotilla.',
 links:[['subneteo','Cada pilar vive en su propia subred: veamos cómo se reparte la 192.168.0.0/20']]
},

{id:'subneteo', et:0, title:'Subneteo: de 192.168.0.0/20 a redes /24', focus:['r'], rubk:'base',
 prob:'El caso pide usar 192.168.0.0/20 dividida en subredes /24. Cada grupo (empleados, invitados, servidores, IoT) necesita su propia red.',
 rub:'Infraestructura base (20 %): "sin errores de subneteo"',
 theory:`
<p><b>Subnetear</b> es partir una red grande en redes más pequeñas. Sirve para ordenar, para aplicar seguridad por grupo y para reducir el tráfico de broadcast.</p>
<h3>Leer el /20</h3>
<p>El número después de la diagonal dice cuántos de los 32 bits son de red:</p>
<pre class="code">/20 = 11111111.11111111.11110000.00000000 = 255.255.240.0
      8 bits   8 bits   4 bits</pre>
<p><b>Binario en 30 segundos:</b> cada octeto son 8 casillas (bits) que valen, de izquierda a derecha, <code>128 64 32 16 8 4 2 1</code>. Un 1 significa "suma este valor". Así, <code>11110000</code> = 128 + 64 + 32 + 16 = <b>240</b>, y <code>11111111</code> = 255.</p>
<p>Quedan 32 − 20 = 12 bits de host → 2¹² = <b>4096 direcciones</b>, de <code>192.168.0.0</code> a <code>192.168.15.255</code>. El tercer octeto tiene 4 bits libres, que van de 0000 (0) a 1111 (15).</p>
<h3>Partirla en /24</h3>
<p>De /20 a /24 tomas prestados <b>4 bits</b>: 2⁴ = <b>16 subredes</b>, cada una con 2⁸ − 2 = <b>254 hosts</b>. Las subredes son 192.168.<b>0</b>.0, 192.168.<b>1</b>.0 … 192.168.<b>15</b>.0: el tercer octeto avanza de uno en uno.</p>
<div class="analogy">Tienes un terreno de 16 manzanas (la /20). Lo divides en 16 manzanas iguales de 254 lotes (las /24). Le das una manzana a cada grupo y dejas las sobrantes para crecer.</div>
<h3>Tu reparto</h3>
${T_VLANS}
<p><b>Convención:</b> el <code>.1</code> de cada red es siempre el router. Así es fácil de recordar y de explicar.</p>
<p>Prueba la <a href="#herramientas" data-goto-tool="calc">calculadora de subredes</a>: escribe cualquier IP y te dice su red, broadcast y a qué VLAN pertenece.</p>`,
 steps:[
  {t:'En una hoja, escribe en binario el tercer octeto de 255.255.240.0 (11110000) y explica con tus palabras por qué la /20 llega hasta 192.168.15.255.'},
  {t:'Escribe de memoria las 7 subredes que usas, con su VLAN, uso y gateway. Compara con la tabla de arriba.'},
  {t:'Abre la calculadora de subredes (Herramientas → Calculadora) y prueba: <code>192.168.2.30/24</code>, <code>192.168.0.0/20</code>, <code>192.168.9.1/24</code>. Fíjate qué VLAN te dice en cada caso.'},
  {t:'Responde el quiz de esta lección sin mirar la tabla.'}
 ],
 verify:[['¿Cuántas /24 caben en una /20?','16'],['¿Última dirección de la /20?','192.168.15.255'],['¿Gateway de la VLAN 30?','192.168.3.1']],
 quiz:[
  {q:'¿Cuántos bits se prestan para pasar de /20 a /24 y cuántas subredes salen?', o:['8 bits, 256 subredes','4 bits, 16 subredes','4 bits, 14 subredes','2 bits, 4 subredes'], a:1, e:'24 − 20 = 4 bits prestados; 2⁴ = 16 subredes.'},
  {q:'¿Cuál es la máscara decimal de un /20?', o:['255.255.255.0','255.255.240.0','255.255.248.0','255.255.0.0'], a:1, e:'20 bits en 1: 255.255 y en el tercer octeto 11110000 = 240.'},
  {q:'¿Qué IP NO pertenece a la red de la empresa 192.168.0.0/20?', o:['192.168.0.10','192.168.6.20','192.168.15.200','192.168.16.1'], a:3, e:'La /20 termina en 192.168.15.255. La 192.168.16.1 ya está fuera.'},
  {q:'¿Por qué los invitados tienen su propia subred?', o:['Para tener más velocidad','Para poder aplicar reglas de seguridad solo a ellos','Porque el DHCP lo exige','Porque el router no soporta más IPs'], a:1, e:'Al estar en su propia red/VLAN, el router puede filtrar su tráfico con una ACL sin afectar a nadie más.'}
 ],
 say:'La /20 tiene 4096 direcciones. Al llevarla a /24 prestamos 4 bits: obtenemos 16 subredes de 254 hosts. Usamos 7 (gestión, corporativo, invitados, servidores, IoT, enlace 4G y celular) y dejamos 9 para crecimiento. El .1 de cada una es el router.',
 links:[['vlans','Cada subred se convierte en una VLAN en los switches'],['router','Cada .1 se configura como subinterfaz del router']]
},

{id:'cableado', et:1, title:'Colocar y cablear los equipos', focus:Object.keys(NODES), rubk:'base',
 prob:'El archivo .pkt es una evidencia obligatoria. Un cableado ordenado y con los puertos correctos evita la mitad de los errores.',
 rub:'Infraestructura base (20 %) y Documentación (topología)',
 theory:`
<h3>Los equipos y su papel</h3>
<div class="tbl"><table><thead><tr><th>Cant.</th><th>En Packet Tracer</th><th>Nombre</th><th>Para qué</th></tr></thead><tbody>
<tr><td>1</td><td>Routers → 2911</td><td>R-CORE</td><td>Une todas las redes</td></tr>
<tr><td>2</td><td>Switches → 2960</td><td>SW-CORE, SW-ALMACEN</td><td>Un switch por edificio</td></tr>
<tr><td>1</td><td>Wireless Devices → WLC-3504 (o 2504)</td><td>WLC</td><td>Controla los APs</td></tr>
<tr><td>3</td><td>Wireless Devices → LAP-PT (o 3702i)</td><td>AP-1, AP-2, AP-3</td><td>Antenas WiFi</td></tr>
<tr><td>3</td><td>End Devices → Server</td><td>SRV-RADIUS, SRV-IOT, SRV-CENTRAL</td><td>Autenticación, IoT, portal web</td></tr>
<tr><td>1</td><td>End Devices → PC</td><td>PC-ADMIN</td><td>Administrar la WLC por web</td></tr>
<tr><td>3 + 1</td><td>End Devices → Laptop / Tablet</td><td>LAP-EMPLEADO-1, LAP-EMPLEADO-2, LAP-VISITANTE, TAB-ALMACEN</td><td>Clientes WiFi</td></tr>
<tr><td>1 + 1</td><td>WAN Emulation → Central Office Server / Cell Tower</td><td>CENTRAL-OFFICE, TORRE-4G</td><td>Red celular</td></tr>
<tr><td>2</td><td>End Devices → Smartphone</td><td>CEL-CHOFER-1, CEL-VENTAS</td><td>Flotilla</td></tr>
<tr><td>6</td><td>End Devices → Home / Smart City</td><td>TEMP, PUERTA, HUMO, VENTILADOR, SIRENA, LUZ</td><td>Sensores y actuadores</td></tr>
</tbody></table></div>
<h3>Tipos de cable</h3>
<ul><li><b>Directo (Copper Straight-Through):</b> entre equipos distintos (PC–switch, router–switch, AP–switch).</li>
<li><b>Cruzado (Copper Cross-Over):</b> entre equipos iguales (switch–switch).</li>
<li><b>Coaxial:</b> torre celular ↔ Central Office.</li></ul>
<p><b>FastEthernet (Fa)</b> = 100 Mbps; <b>GigabitEthernet (G)</b> = 1000 Mbps. Los enlaces que cargan más tráfico (router y entre switches) van en G.</p>
<h3>Conexiones exactas</h3>
<div class="tbl"><table><thead><tr><th>Desde</th><th>Puerto</th><th>Hasta</th><th>Puerto</th><th>Cable</th></tr></thead><tbody>
${[['R-CORE','G0/0','SW-CORE','G0/1','Directo'],['R-CORE','G0/1','CENTRAL-OFFICE','Backbone','Directo'],['CENTRAL-OFFICE','Coaxial','TORRE-4G','Coaxial','Coaxial'],['SW-CORE','G0/2','SW-ALMACEN','G0/1','Cruzado'],['SW-CORE','Fa0/1','WLC','Gig0/1 (puerto 1)','Directo'],['SW-CORE','Fa0/2','AP-1','G0','Directo'],['SW-CORE','Fa0/10','SRV-RADIUS','Fa0','Directo'],['SW-CORE','Fa0/11','SRV-IOT','Fa0','Directo'],['SW-CORE','Fa0/12','SRV-CENTRAL','Fa0','Directo'],['SW-CORE','Fa0/20','PC-ADMIN','Fa0','Directo'],['SW-ALMACEN','Fa0/1','AP-2','G0','Directo'],['SW-ALMACEN','Fa0/2','AP-3','G0','Directo']].map(r=>`<tr><td>${r[0]}</td><td class="mono">${r[1]}</td><td>${r[2]}</td><td class="mono">${r[3]}</td><td>${r[4]}</td></tr>`).join('')}
</tbody></table></div>
<p>Usa siempre el <b>puerto exacto</b>: las configuraciones que pegarás después dependen de él.</p>`,
 steps:[
  {t:'Crea el archivo <code>Innova_dia2.pkt</code>. Coloca todos los equipos de la tabla. Usa la topología de arriba como guía de posición.'},
  {t:'Renombra cada equipo: clic → pestaña <b>Config</b> → Display Name (y Hostname en los servidores/PCs).'},
  {t:'Cablea según la tabla de conexiones. Para elegir el puerto, haz clic en el cable y luego en el equipo: aparece la lista de puertos.'},
  {t:'Si un AP aparece apagado, abre su pestaña <b>Physical</b> y arrastra el <b>Power Adapter</b> al conector.'},
  {t:'Dibuja zonas de color (rectángulo) para Oficinas, Almacén y Flotilla 4G, con una nota de texto en cada una.'},
  {t:'Guarda el archivo.'}
 ],
 verify:[['Los puntos de cada cable','Verdes, o naranjas mientras arrancan'],['Puertos del router','En rojo por ahora: es normal hasta hacer "no shutdown" (lección 6)']],
 quiz:[
  {q:'¿Qué cable usas entre SW-CORE y SW-ALMACEN?', o:['Directo','Cruzado','Coaxial','Serial'], a:1, e:'Son equipos iguales (switch–switch): cable cruzado.'},
  {q:'¿Por qué el router y los switches se unen por puertos Gigabit?', o:['Porque los Fa no funcionan en PT','Porque esos enlaces llevan el tráfico de todas las VLANs juntas','Para usar menos cable','Porque lo exige el DHCP'], a:1, e:'Los enlaces troncales concentran el tráfico de todos; conviene que sean los más rápidos.'},
  {q:'¿Qué cable une la torre celular con el Central Office?', o:['Fibra','Directo','Coaxial','Consola'], a:2, e:'En Packet Tracer, la torre y el Central Office se conectan con coaxial.'}
 ],
 say:'Tenemos un switch por edificio unidos por un enlace Gigabit. Al switch de oficinas llegan el router, la WLC, el AP-1, los servidores y la PC de administración; al del almacén, el AP-2 y el AP-3. El router tiene un segundo puerto hacia la red celular.',

{id:'vlans', et:1, title:'VLANs y trunks en los switches', focus:['swc','swa','r','wlc'], rubk:'base',
 prob:'Separar empleados, invitados, servidores, sensores y gestión, aunque compartan los mismos switches y cables.',
 rub:'Infraestructura base (20 %): VLANs y trunking 802.1Q',
 theory:`
<p>Una <b>VLAN</b> divide un switch físico en varios switches lógicos. Los equipos de la VLAN 10 no ven a los de la VLAN 20 aunque estén en el mismo switch. Cada VLAN es un <b>dominio de broadcast</b> separado.</p>
<div class="analogy">Un edificio con varias oficinas cerradas: comparten pasillos y elevador (el switch y los cables), pero cada oficina tiene su puerta. Para pasar de una oficina a otra hay que ir con recepción (el router).</div>
<p>Regla del proyecto: <b>1 VLAN = 1 subred</b>. VLAN 10 ↔ 192.168.1.0/24, VLAN 20 ↔ 192.168.2.0/24, etc.</p>
<h3>Puerto de acceso y puerto trunk</h3>
<ul><li><b>Access:</b> pertenece a <b>una</b> VLAN. Para equipos finales: PC, servidor… y también los APs (en la lección 10 verás por qué).</li>
<li><b>Trunk:</b> lleva <b>varias</b> VLANs por un solo cable. Entre switches, hacia el router y hacia la WLC.</li></ul>
<h3>802.1Q y VLAN nativa</h3>
<p>Por un trunk viajan tramas de muchas VLANs. Para distinguirlas, el switch inserta una <b>etiqueta 802.1Q</b> de 4 bytes con el número de VLAN. La <b>VLAN nativa</b> es la única que viaja <b>sin etiqueta</b>, y debe ser la misma en ambos extremos del trunk.</p>
<p>Usamos la <b>99</b> como nativa porque la WLC envía su tráfico de gestión sin etiqueta y ese tráfico debe caer en la VLAN 99.</p>
<h3>Otros comandos</h3>
<ul><li><code>switchport trunk allowed vlan 10,20,30,40,99</code>: solo esas VLANs pasan por el trunk (seguridad).</li>
<li><code>spanning-tree portfast</code>: el puerto de un equipo final empieza a funcionar al instante, sin esperar los ~30 s de STP. Nunca en un trunk.</li>
<li><code>shutdown</code> en puertos sin uso: nadie puede conectar un equipo intruso.</li>
<li><code>interface vlan 99</code> + IP: para administrar el switch a distancia.</li></ul>`,
 steps:[
  {t:'Abre SW-CORE → CLI, presiona Enter y pega esta configuración completa: botón <b>Copiar</b> de aquí y luego, en Packet Tracer, el botón <b>Paste</b> que está debajo de la consola (o Ctrl+V dentro de la consola).', code:'sw_core'},
  {t:'Abre SW-ALMACEN → CLI y pega la suya.', code:'sw_alm'},
  {t:'Lee la configuración que pegaste y ubica: dónde se crean las VLANs, cuáles puertos son trunk, cuáles access y en qué VLAN.'},
  {t:'Ejecuta los comandos de verificación (abajo) en ambos switches y toma captura de cada uno para el reporte.'},
  {t:'Guarda el .pkt.'}
 ],
 verify:[['SW-CORE# show vlan brief','VLANs 10, 20, 30, 40, 99 activas; Fa0/2 y Fa0/20 en 99; Fa0/10-12 en 30'],['SW-CORE# show interfaces trunk','G0/1, G0/2 y Fa0/1 en trunking, Native vlan 99'],['SW-ALMACEN# show vlan brief','Fa0/1 y Fa0/2 en VLAN 99']],
 quiz:[
  {q:'¿Por qué los puertos trunk no aparecen en "show vlan brief"?', o:['Porque están apagados','Porque pertenecen a todas las VLANs permitidas, no a una sola','Porque son Gigabit','Es un error de configuración'], a:1, e:'Es normal: un trunk transporta varias VLANs. Se revisa con "show interfaces trunk".'},
  {q:'¿Qué pasa si un trunk tiene VLAN nativa 99 en un lado y 1 en el otro?', o:['Nada','Error "native VLAN mismatch" y el tráfico sin etiqueta cae en la VLAN equivocada','El trunk se vuelve más rápido','Se borran las VLANs'], a:1, e:'La nativa debe coincidir en ambos extremos.'},
  {q:'¿Qué hace la etiqueta 802.1Q?', o:['Cifra la trama','Indica a qué VLAN pertenece la trama dentro de un trunk','Asigna la IP','Elige el canal WiFi'], a:1, e:'Son 4 bytes con el ID de VLAN, para que el otro extremo del trunk sepa a qué VLAN entregarla.'},
  {q:'¿Dónde NO se debe usar PortFast?', o:['En el puerto de una PC','En el puerto de un servidor','En un enlace trunk entre switches','En el puerto de un AP'], a:2, e:'PortFast es para equipos finales. En enlaces entre switches podría provocar bucles.'}
 ],
 say:'Creamos cinco VLANs. Los equipos finales y los APs van en puertos de acceso; los enlaces entre switches, al router y a la WLC son trunks 802.1Q que etiquetan cada trama con su VLAN. La VLAN nativa es la 99 en todos los trunks porque la gestión de la WLC viaja sin etiqueta.',
 links:[['router','Las VLANs están separadas: el router las comunica'],['wlc','Por qué el puerto de la WLC es trunk y el de los APs es access']]
},

{id:'router', et:1, title:'Router-on-a-stick: comunicar las VLANs', focus:['r','swc'], rubk:'base',
 prob:'Los empleados (VLAN 10) necesitan llegar a los servidores (VLAN 30). Solo un router puede unir redes distintas.',
 rub:'Infraestructura base (20 %): Inter-VLAN Routing',
 theory:`
<p><b>Router-on-a-stick</b> usa un solo cable trunk entre switch y router. El puerto del router se divide en <b>subinterfaces</b> virtuales (<code>G0/0.10</code>, <code>G0/0.20</code>…). Cada subinterfaz:</p>
<ul><li>atiende una VLAN: <code>encapsulation dot1Q 10</code></li>
<li>tiene la IP que es el <b>gateway</b> de esa VLAN: <code>192.168.1.1</code></li></ul>
<p>Un paquete de la VLAN 10 hacia la VLAN 30 sube al router por el trunk con etiqueta 10. El router lo enruta y lo baja por el mismo cable con etiqueta 30.</p>
<div class="analogy">Un solo elevador (el cable) que para en varios pisos (VLANs). El router es el operador que recibe a alguien en el piso 10 y lo deja en el piso 30.</div>
<h3>La tabla de rutas</h3>
<ul><li><b>C (conectadas):</b> redes que el router tiene en sus interfaces. Las aprende solo.</li>
<li><b>S (estáticas):</b> las escribes tú. Necesitarás una hacia los celulares (lección 15).</li></ul>
<h3>Qué hace cada parte del bloque</h3>
<ul><li><code>hostname</code>, <code>enable secret</code>, <code>service password-encryption</code>, <code>banner motd</code>: identidad y contraseñas cifradas.</li>
<li><code>ip domain-name</code>, <code>username</code>, <code>crypto key generate rsa</code>, <code>ip ssh version 2</code>, <code>transport input ssh</code>: administración remota cifrada con <b>SSH</b> (Telnet manda todo en texto plano).</li>
<li><code>interface G0/0</code> + <code>no shutdown</code>: enciende el puerto físico; las subinterfaces dependen de él.</li>
<li><code>encapsulation dot1Q 99 native</code>: la VLAN 99 llega sin etiqueta, igual que en los switches.</li></ul>
<p>Esta es la primera de varias partes de la configuración del router. Las siguientes (DHCP, ACLs, red 4G) las agregarás en su lección, para entender cada una.</p>`,
 steps:[
  {t:'Abre R-CORE → CLI. Si pregunta "initial configuration dialog", responde <code>no</code>. Pega el bloque 1.', code:'r_base'},
  {t:'Si PT pregunta por el tamaño de la llave RSA, escribe <code>1024</code>. Espera a que termine.'},

{id:'dhcp', et:1, title:'DHCP: IPs automáticas para todos', focus:['r'], rubk:'base',
 prob:'Laptops, tablets, sensores y APs necesitan IP sin configurarlos a mano uno por uno.',
 rub:'Infraestructura base (20 %): DHCP en switches/routers',
 theory:`
<p><b>DHCP</b> entrega automáticamente IP, máscara, gateway y DNS. Funciona en 4 pasos, <b>DORA</b>:</p>
<ol><li><b>Discover:</b> el cliente pregunta a todos "¿hay un servidor DHCP?" (broadcast).</li>
<li><b>Offer:</b> el servidor responde "te ofrezco la 192.168.1.11".</li>
<li><b>Request:</b> el cliente responde "la quiero".</li>
<li><b>Acknowledge:</b> el servidor confirma "es tuya".</li></ol>
<div class="analogy">Llegas a un hotel (la red): preguntas en recepción si hay cuarto, te ofrecen uno, lo aceptas y te dan la llave.</div>
<ul><li><b>Pool:</b> el rango que reparte para una red. Hay uno por VLAN.</li>
<li><b>excluded-address:</b> IPs que el DHCP no debe dar porque ya están ocupadas (gateway, WLC, switches, PC-ADMIN).</li>
<li><b>default-router</b> y <b>dns-server</b>: el gateway y el DNS que se le entregan al cliente.</li></ul>
<h3>Quién usa DHCP y quién no</h3>
<ul><li>Con DHCP: APs (pool GESTION-APs), laptops corporativas, visitantes, sensores IoT.</li>
<li>Con IP fija: router, switches, WLC, servidores y PC-ADMIN. Todos los demás los buscan por esa dirección, así que no puede cambiar.</li>
<li>No hay pool para la VLAN 30 porque ahí solo hay servidores con IP fija.</li>
<li>Los invitados reciben DNS 8.8.8.8 (un DNS público de Internet), porque no deben consultar el DNS interno. En el .pkt no hay Internet, así que solo queda configurado para cuando exista.</li></ul>
<p>¿Por qué funciona si el router está en otra parte de la red? Porque cada subinterfaz está <b>dentro</b> de su VLAN: el broadcast del Discover le llega directamente.</p>`,
 steps:[
  {t:'En R-CORE, entra a modo <code>R-CORE#</code> (<code>enable</code>, contraseña <code>Innova2026</code>) y pega el bloque 2.', code:'r_dhcp'},
  {t:'Lee cada pool y relaciónalo con su VLAN en la tabla de la lección 3.'},
  {t:'Ejecuta <code>show ip dhcp pool</code>. Todavía no habrá IPs entregadas: los clientes llegan en las lecciones 10 a 14. Vuelve a este comando después.'},
  {t:'Guarda el .pkt.'}
 ],
 verify:[['R-CORE# show ip dhcp pool','4 pools: GESTION-APs, CORPORATIVO, INVITADOS, IOT'],['R-CORE# show ip dhcp binding (después de la lección 10)','IPs 192.168.0.21+ para los APs']],
 quiz:[
  {q:'¿En qué orden ocurre DHCP?', o:['Request, Offer, Discover, Ack','Discover, Offer, Request, Acknowledge','Offer, Discover, Ack, Request','Discover, Request, Offer, Ack'], a:1, e:'DORA: Discover, Offer, Request, Acknowledge.'},
  {q:'¿Para qué sirve "ip dhcp excluded-address 192.168.0.1 192.168.0.20"?', o:['Para bloquear esas IPs en la ACL','Para que el DHCP no reparta IPs ya usadas por el router, switches, WLC y PC-ADMIN','Para darles prioridad','Para crear la VLAN 99'], a:1, e:'Evita conflictos de IP duplicada con los equipos de IP fija.'},
  {q:'¿Por qué los servidores tienen IP fija?', o:['Porque DHCP no funciona en servidores','Porque la WLC, los sensores y los clientes los buscan por una IP que no debe cambiar','Por la VLAN nativa','Porque así lo pide 802.1X'], a:1, e:'Por ejemplo, la WLC tiene configurado el RADIUS en 192.168.3.10: si cambiara, nadie podría autenticarse.'}
 ],
 say:'El router es el servidor DHCP con un pool por VLAN. Excluimos las direcciones de los equipos con IP fija: router, switches, WLC y servidores. El cliente obtiene su IP con el proceso DORA.',
 links:[['servidores','Ahora configuramos los equipos de IP fija y probamos que todo se comunica'],['wlc','Los APs usarán el pool GESTION-APs para encontrar a la WLC']]
},

{id:'servidores', et:1, title:'Servidores y primera prueba de la red', focus:['adm','rad','iot','cen','swc','r'], rubk:'base',
 prob:'Los servidores son el destino de todo: RADIUS valida empleados, IoT controla el almacén y el Central recibe las entregas.',
 rub:'Infraestructura base (20 %) y prueba de que el Inter-VLAN funciona',
 theory:`
<ul><li><b>SRV-RADIUS (192.168.3.10):</b> verifica usuario y contraseña de los empleados. Lo configuras en la lección 12.</li>
<li><b>SRV-IOT (192.168.3.11):</b> registra sensores y ejecuta reglas. Lección 14.</li>
<li><b>SRV-CENTRAL (192.168.3.12):</b> portal web de entregas (<b>HTTP/HTTPS</b>) y <b>DNS</b>.</li></ul>
<p><b>DNS</b> traduce nombres a IPs, como la agenda de tu celular: escribes <code>entregas.innovalogistics.local</code> y el DNS responde <code>192.168.3.12</code>.</p>
<p><b>HTTPS</b> es HTTP cifrado con TLS: nadie en el camino puede leer lo que envías. Los choferes lo usarán desde la red 4G.</p>
<h3>Por qué esta lección es una prueba</h3>
<p>PC-ADMIN está en la VLAN 99 y los servidores en la 30. Si el ping entre ellos funciona, demuestras que <b>VLANs, trunks y router-on-a-stick</b> están bien. Es la primera evidencia fuerte del criterio de infraestructura.</p>
<h3>Si el ping falla, revisa en este orden</h3>
<ol><li>IP, máscara y gateway del equipo.</li><li>Puerto del switch en la VLAN correcta (<code>show vlan brief</code>).</li><li>Trunk activo (<code>show interfaces trunk</code>).</li><li>Subinterfaz del router up (<code>show ip interface brief</code>).</li></ol>`,
 steps:[
  {t:`Configura IP estática (Desktop → IP Configuration → Static):<div class="tbl"><table><thead><tr><th>Equipo</th><th>IP</th><th>Máscara</th><th>Gateway</th><th>DNS</th></tr></thead><tbody>
<tr><td>SRV-RADIUS</td><td class="mono">192.168.3.10</td><td class="mono">255.255.255.0</td><td class="mono">192.168.3.1</td><td class="mono">192.168.3.12</td></tr>
<tr><td>SRV-IOT</td><td class="mono">192.168.3.11</td><td class="mono">255.255.255.0</td><td class="mono">192.168.3.1</td><td class="mono">192.168.3.12</td></tr>
<tr><td>SRV-CENTRAL</td><td class="mono">192.168.3.12</td><td class="mono">255.255.255.0</td><td class="mono">192.168.3.1</td><td class="mono">192.168.3.12</td></tr>
<tr><td>PC-ADMIN</td><td class="mono">192.168.0.20</td><td class="mono">255.255.255.0</td><td class="mono">192.168.0.1</td><td class="mono">192.168.3.12</td></tr></tbody></table></div>`},
  {t:'SRV-CENTRAL → Services → <b>HTTP</b>: HTTP On y HTTPS On. Edita <code>index.html</code> y escribe: <code>&lt;h1&gt;InnovaLogistics - Portal de Entregas&lt;/h1&gt;</code>.'},
  {t:'SRV-CENTRAL → Services → <b>DNS</b>: On. Agrega registros tipo A: <code>entregas.innovalogistics.local</code> → 192.168.3.12 e <code>iot.innovalogistics.local</code> → 192.168.3.11.'},
  {t:'En los tres servidores, apaga el servicio <b>DHCP</b> si está encendido (el DHCP lo da el router).'},
  {t:'Desde PC-ADMIN → Command Prompt: <code>ping 192.168.0.1</code> y luego <code>ping 192.168.3.12</code>. Es normal que el primer intento muestre "Request timed out": la PC está averiguando la dirección MAC del router (proceso ARP). Los siguientes responden.'},
  {t:'Desde PC-ADMIN → Web Browser: <code>entregas.innovalogistics.local</code>. Debe aparecer el portal. Toma captura.'}
 ],

 quiz:[
  {q:'PC-ADMIN (VLAN 99) hace ping al servidor (VLAN 30) y funciona. ¿Qué demuestra?', o:['Que el WiFi funciona','Que VLANs, trunks y el enrutamiento entre VLANs están bien','Que RADIUS funciona','Solo que el cable está conectado'], a:1, e:'El paquete tuvo que subir por el trunk al router, cambiar de VLAN y bajar al servidor.'},

{id:'wifi', et:2, title:'Cómo funciona el WiFi', focus:['ap1','ap2','ap3','cli'], rubk:'wlc',
 prob:'El problema 1 de la empresa es de radio: mismo canal, interferencia, sin cobertura. Esta teoría explica por qué y cómo lo resolvemos.',
 rub:'WLC, WLANs y roaming (25 %): base teórica que te preguntarán',
 theory:`
<p>El WiFi es la familia de estándares <b>IEEE 802.11</b>: transmite datos con ondas de radio.</p>
<div class="tbl"><table><thead><tr><th>Estándar</th><th>Nombre</th><th>Banda</th><th>Máx. aprox.</th></tr></thead><tbody>
<tr><td>802.11b</td><td>—</td><td>2.4 GHz</td><td>11 Mbps</td></tr><tr><td>802.11a</td><td>—</td><td>5 GHz</td><td>54 Mbps</td></tr>
<tr><td>802.11g</td><td>—</td><td>2.4 GHz</td><td>54 Mbps</td></tr><tr><td>802.11n</td><td>WiFi 4</td><td>2.4 / 5 GHz</td><td>600 Mbps</td></tr>
<tr><td>802.11ac</td><td>WiFi 5</td><td>5 GHz</td><td>~3.5 Gbps</td></tr><tr><td>802.11ax</td><td>WiFi 6/6E</td><td>2.4 / 5 / 6 GHz</td><td>~9.6 Gbps</td></tr></tbody></table></div>
<h3>Bandas y canales</h3>
<p><b>2.4 GHz</b> llega más lejos y atraviesa mejor las paredes, pero tiene más interferencia y solo <b>3 canales que no se enciman: 1, 6 y 11</b>. <b>5 GHz</b> tiene más canales y velocidad, pero menos alcance.</p>
<p>Los canales de 2.4 GHz están separados 5 MHz, pero cada uno ocupa unos 22 MHz, así que se enciman con sus vecinos. Prueba aquí: elige el canal de cada AP.</p>
<div data-widget="canales"></div>
<h3>Por qué el mismo canal es un problema</h3>
<p>En el aire no se pueden detectar choques, así que el WiFi usa <b>CSMA/CA</b>: escuchar antes de hablar y esperar turno. Si todos los APs están en el mismo canal, todos esperan a todos: lentitud y caídas. Se llama <b>interferencia co-canal</b> y es exactamente lo que pasaba con los routers caseros.</p>
<h3>SSID, BSS y ESS</h3>
<ul><li><b>SSID:</b> el nombre de la red (INNOVA-CORP).</li>
<li><b>BSSID:</b> la MAC del radio de cada AP; identifica a cada antena.</li>
<li><b>BSS:</b> un AP con sus clientes.</li>
<li><b>ESS:</b> varios APs con el <b>mismo SSID</b> unidos por la red cableada. Para el usuario es una sola red grande. <b>Es lo que pide el proyecto.</b></li>
<li><b>IBSS (ad-hoc):</b> equipos conectados entre sí sin AP.</li></ul>
<h3>Roaming</h3>
<p>Es cambiar de AP sin desconectarse. Lo decide el <b>cliente</b> cuando la señal del AP actual baja. Requisitos: mismo SSID, misma seguridad, coberturas que se enciman un 15–20 % y canales distintos en APs vecinos.</p>
<div class="analogy">Como el celular en una llamada mientras viajas en carretera: cambia de antena sin cortar. Aquí cambias del AP de oficinas al del almacén sin perder la conexión.</div>`,
 steps:[
  {t:'En el simulador de canales, pon los tres APs en el canal 1 (como estaba la empresa) y observa el aviso. Luego aplica 1/6/11.'},
  {t:'Prueba 1/3/6: verás por qué no basta con "canales distintos"; tienen que estar separados por al menos 5.'},
  {t:'Explica en voz alta, en 30 segundos, por qué los routers caseros fallaban (mismo canal + CSMA/CA).'},
  {t:'Dibuja en una hoja un BSS y un ESS. Marca dónde ocurre el roaming.'}
 ],
 verify:[['¿Canales sin traslape en 2.4 GHz?','1, 6 y 11'],['¿Qué es un ESS?','Varios APs con el mismo SSID unidos por la red cableada']],
 quiz:[
  {q:'¿Por qué se eligen los canales 1, 6 y 11?', o:['Son los más rápidos','Son los únicos de 2.4 GHz que no se enciman entre sí','Los exige la WLC','Son de 5 GHz'], a:1, e:'Cada canal ocupa ~22 MHz y están separados 5 MHz; solo 1, 6 y 11 quedan sin traslape.'},
  {q:'¿Qué es un ESS?', o:['Un AP sin clientes','Varios APs con el mismo SSID formando una sola red','Un tipo de cifrado','Una VLAN'], a:1, e:'Extended Service Set: el conjunto de BSS con el mismo SSID. Permite el roaming.'},
  {q:'¿Quién decide hacer roaming?', o:['La WLC','El router','El cliente (la laptop)','El servidor RADIUS'], a:2, e:'El cliente decide cambiar cuando la señal del AP actual se debilita. La WLC lo facilita.'},
  {q:'¿Qué método de acceso al medio usa el WiFi?', o:['CSMA/CD','CSMA/CA','Token Ring','TDMA'], a:1, e:'CSMA/CA (evitar colisiones). CSMA/CD es de Ethernet cableado antiguo.'}
 ],
 say:'Los routers caseros estaban todos en el mismo canal de 2.4 GHz; con CSMA/CA se estorbaban entre sí. Pusimos los tres APs en los canales 1, 6 y 11, que no se enciman, y con el mismo SSID forman un ESS que permite roaming.',
 links:[['wlc','Ahora el equipo que coordina a los tres APs: la WLC'],['ssids','El roaming lo probarás en la lección 11']]
},

{id:'wlc', et:2, title:'La WLC, los APs ligeros y CAPWAP', focus:['wlc','ap1','ap2','ap3','swc','swa','adm'], rubk:'wlc',
 prob:'Reemplazar los routers caseros independientes por una infraestructura centralizada.',
 rub:'WLC, WLANs y roaming (25 %): "aprovisiona los LAPs en modo CAPWAP"',
 theory:`
<h3>AP autónomo y AP ligero</h3>
<ul><li><b>AP autónomo:</b> tiene cerebro propio; cada uno se configura por separado (como los routers caseros).</li>
<li><b>Lightweight AP (LAP):</b> no se configura solo; obedece a una <b>WLC</b>.</li></ul>
<p>La <b>WLC</b> (Wireless LAN Controller) es el cerebro central: SSIDs, seguridad, canales y VLANs se configuran ahí una vez y se aplican a todos los APs.</p>
<h3>Split-MAC</h3>
<ul><li>El <b>AP</b> hace lo inmediato: transmitir, enviar <i>beacons</i> (los anuncios del SSID), confirmar recepción, cifrar en el aire.</li>
<li>La <b>WLC</b> hace la gestión: decidir quién entra, autenticar, asignar la VLAN, controlar el roaming.</li></ul>
<div class="analogy">Los APs son meseros y la WLC es el gerente. Los meseros atienden las mesas al momento; el gerente decide quién entra, en qué sección se sienta y qué reglas aplican.</div>
<h3>CAPWAP</h3>
<p>Es el túnel entre cada AP y la WLC:</p>
<ul><li><b>UDP 5246:</b> control (órdenes y configuración), cifrado con DTLS.</li>
<li><b>UDP 5247:</b> datos (el tráfico de los usuarios va encapsulado aquí).</li></ul>
<h3>Cómo encuentra el AP a la WLC</h3>
<ol><li>El AP enciende y pide IP por DHCP (pool GESTION-APs, VLAN 99).</li>
<li>Envía un <b>discovery</b> por broadcast. La WLC está en la misma VLAN 99, lo escucha y responde.</li>
<li>Se forma el túnel CAPWAP y el AP descarga su configuración.</li></ol>
<p>Si la WLC estuviera en otra subred se usaría la <b>opción 43 de DHCP</b> o un registro DNS <code>CISCO-CAPWAP-CONTROLLER</code>.</p>
<h3>Por qué el AP va en access y la WLC en trunk</h3>
<ul><li>El AP solo envía CAPWAP en la VLAN 99; el tráfico de los usuarios va <b>dentro</b> del túnel. No necesita etiquetas: <b>access</b>.</li>
<li>La WLC saca el tráfico del túnel y lo entrega en la VLAN de cada usuario (10, 20, 40) además de su gestión (99): <b>trunk</b>.</li></ul>
<p>Este modo, en que todo el tráfico pasa por la WLC, se llama <b>modo Local</b>. El otro modo, <b>FlexConnect</b>, deja que el AP conmute localmente (útil en sucursales).</p>`,
 steps:[
  {t:'WLC → pestaña <b>Config</b> → Management: IP <code>192.168.0.10</code>, máscara <code>255.255.255.0</code>, gateway <code>192.168.0.1</code>. Si tu modelo de WLC no muestra esos campos en Config, bórrala y usa la <b>WLC-2504</b>, que sí los tiene.'},
  {t:'Espera 1–2 minutos (o usa el botón de adelantar tiempo, abajo a la izquierda) para que los APs obtengan IP y se unan.'},
  {t:'PC-ADMIN → Web Browser → <code>https://192.168.0.10</code>. Si es la primera vez, crea el usuario administrador: <code>admin</code> / <code>Admin2026</code>. Si aparece un asistente inicial, usa nombre <code>WLC-INNOVA</code>, IP 192.168.0.10/24, gateway 192.168.0.1.'},
  {t:'En la WLC: <b>Wireless → All APs</b>. Deben aparecer los 3 APs. Toma captura.'},
  {t:'Renombra los APs (clic en cada uno): <code>AP-1-OFICINAS</code>, <code>AP-2-ALMACEN-A</code>, <code>AP-3-ALMACEN-B</code>.'},
  {t:'En R-CORE: <code>show ip dhcp binding</code>. Verás 3 IPs 192.168.0.x: son los APs.'},
  {t:'Cambia a <b>Simulation Mode</b>, filtra el protocolo <b>CAPWAP</b> y observa los paquetes entre APs y WLC. Regresa a Realtime. Guarda el .pkt.'}
 ],
 verify:[['WLC web → Wireless → All APs','3 APs registrados'],['R-CORE# show ip dhcp binding','3 IPs en 192.168.0.21–23'],['PC-ADMIN> ping 192.168.0.10','Reply de la WLC']],
 trouble:[['Los APs no aparecen','¿Tienen energía (Power Adapter)? ¿Tienen IP (show ip dhcp binding)? ¿Su puerto está en VLAN 99? ¿La WLC tiene 192.168.0.10?'],['No abre la página de la WLC','¿PC-ADMIN está en VLAN 99 con gateway 192.168.0.1? Prueba ping 192.168.0.10. Prueba http:// en vez de https://.']],
 quiz:[
  {q:'¿Qué puertos usa CAPWAP?', o:['TCP 80 y 443','UDP 5246 (control) y UDP 5247 (datos)','UDP 1812 y 1813','TCP 22'], a:1, e:'5246 para control (cifrado con DTLS) y 5247 para los datos de los clientes.'},
  {q:'¿Cómo descubren los APs a la WLC en tu diseño?', o:['Por DNS','Por broadcast, porque están en la misma VLAN 99 que la WLC','Con un cable de consola','Por la torre celular'], a:1, e:'Están en la misma subred de gestión. En otra subred se usaría DHCP opción 43 o DNS.'},
  {q:'¿Por qué el puerto del AP es access y el de la WLC es trunk?', o:['Por velocidad','El AP solo manda CAPWAP en VLAN 99; la WLC entrega tráfico de varias VLANs','Es al revés','Porque la WLC no tiene IP'], a:1, e:'El tráfico de los usuarios viaja dentro del túnel hasta la WLC; ella lo saca a su VLAN por el trunk.'},
  {q:'En split-MAC, ¿quién decide si un cliente puede entrar a la red?', o:['El AP','La WLC','El switch','El cliente'], a:1, e:'La WLC hace la asociación, autenticación y políticas. El AP hace lo de tiempo real.'}
 ],
 say:'Los APs son lightweight. Al encender piden IP por DHCP en la VLAN de gestión, descubren la WLC por broadcast y forman un túnel CAPWAP: 5246 para control y 5247 para datos. Toda la configuración vive en la WLC y se aplica a los tres APs.',
 links:[['ssids','La WLC está lista: ahora creamos las redes WiFi'],['vlans','Repasa access y trunk si la razón no te quedó clara']]
},

{id:'ssids', et:2, title:'SSIDs, interfaces dinámicas y roaming', focus:['wlc','ap1','ap2','ap3','cli','swc','r'], rubk:'wlc',
 prob:'Cada tipo de usuario debe caer en su VLAN, y un usuario debe moverse entre edificios sin perder conexión.',
 rub:'WLC, WLANs y roaming (25 %): "crea los SSIDs y logra un roaming fluido sin pérdida de paquetes"',
 theory:`
<p>La WLC necesita una "pata" en cada VLAN de usuarios para soltar ahí su tráfico. Cada pata es una <b>interfaz dinámica</b> con su VLAN e IP:</p>
<div class="tbl"><table><thead><tr><th>Interfaz</th><th>VLAN</th><th>IP</th><th>Gateway / DHCP</th><th>SSID</th><th>Seguridad</th></tr></thead><tbody>
<tr><td>CORP</td><td class="mono">10</td><td class="mono">192.168.1.2</td><td class="mono">192.168.1.1</td><td>INNOVA-CORP</td><td>WPA2-Enterprise (lección 12)</td></tr>
<tr><td>GUEST</td><td class="mono">20</td><td class="mono">192.168.2.2</td><td class="mono">192.168.2.1</td><td>INNOVA-GUEST</td><td>WPA2-PSK <code>Visitante2026</code></td></tr>
<tr><td>IOT</td><td class="mono">40</td><td class="mono">192.168.4.2</td><td class="mono">192.168.4.1</td><td>INNOVA-IOT</td><td>WPA2-PSK <code>SensorIoT2026</code></td></tr></tbody></table></div>
<p>Cada SSID se amarra a una interfaz: <b>SSID → interfaz → VLAN</b>.</p>
<pre class="code">Visitante se conecta a "INNOVA-GUEST"
 → AP → túnel CAPWAP → WLC → interfaz GUEST → VLAN 20 → trunk → R-CORE G0/0.20</pre>
<h3>Por qué el roaming no cambia la IP</h3>
<p>Los tres APs pertenecen a la misma WLC, y la WLC mete al usuario siempre en la misma VLAN sin importar por qué AP llegue. El cliente nunca cambia de subred, así que conserva su IP y sus conexiones. Se llama <b>roaming de capa 2 dentro del mismo controlador</b>.</p>
<p><b>Ojo en Packet Tracer:</b> la cobertura de cada AP se calcula con la distancia en la vista <b>Physical</b>. Si todos los equipos están amontonados, la laptop nunca sale del alcance de su AP y no hace roaming. Por eso en los pasos separarás los APs en esa vista.</p>
<p>Con 802.1X el roaming puede tardar más por la reautenticación. En redes reales se acelera con <b>PMK caching</b> u <b>802.11r (Fast Transition)</b>.</p>`,
 steps:[
  {t:`WLC → <b>Controller → Interfaces → New</b>. Crea CORP (VLAN 10), GUEST (VLAN 20) e IOT (VLAN 40) con los datos de la tabla. En cada una: puerto físico <code>1</code> y Primary DHCP Server = su gateway.`},
  {t:'WLC → <b>WLANs → Create New → Go</b>: SSID <code>INNOVA-GUEST</code>, ID 2. General: Status Enabled, Interface <b>GUEST</b>. Security → Layer 2: WPA+WPA2, WPA2 Policy, AES, Auth Key Mgmt <b>PSK</b>, clave <code>Visitante2026</code>. Apply.'},
  {t:'Crea <code>INNOVA-IOT</code>, ID 3, Interface <b>IOT</b>, WPA2 + AES + PSK <code>SensorIoT2026</code>. Apply. (INNOVA-CORP se crea en la lección 12, cuando exista el RADIUS.)'},
  {t:'Canales: <b>Wireless → Access Points → Radios → 802.11b/g/n</b> → cada AP → Channel personalizado: AP-1 = 1, AP-2 = 6, AP-3 = 11. Si tu versión no lo permite, explícalo en la exposición.'},
  {t:'LAP-VISITANTE → Physical: apaga, quita el módulo Ethernet, pon <b>WPC300N</b>, enciende. Config → Wireless0: SSID <code>INNOVA-GUEST</code>, <b>WPA2-PSK</b>, <code>Visitante2026</code>. IP por DHCP: debe recibir 192.168.2.x.'},
  {t:'<b>Prepara el roaming en la vista Physical.</b> En Packet Tracer el alcance del WiFi depende de la posición en la vista <b>Physical</b>, no en la Logical. Cambia a Physical (arriba a la izquierda) y entra hasta donde están tus equipos. Arrastra AP-1 a un extremo (zona Oficinas), AP-2 al centro y AP-3 al otro extremo (zona Almacén), de modo que sus círculos de cobertura apenas se toquen.'},
  {t:'<b>Prueba de roaming:</b> pon la laptop junto a AP-1. En su Command Prompt escribe <code>ping -t 192.168.2.1</code> (si tu versión no acepta <code>-t</code>, usa <code>ping -n 200 192.168.2.1</code>). Sin detener el ping, arrastra la laptop <b>en la vista Physical</b> hasta junto a AP-3. Regresa a Logical: la línea punteada del WiFi ahora llega a otro AP. El ping siguió y <code>ipconfig</code> muestra la misma IP. Toma captura. Si la laptop no cambia de AP, aleja más los APs entre sí.'},
  {t:'WLC → <b>Monitor → Clients</b>: verás la laptop y en qué AP está. Guarda el .pkt.'}
 ],
 verify:[['LAP-VISITANTE> ipconfig','192.168.2.x, gateway 192.168.2.1'],['WLC → WLANs','INNOVA-GUEST e INNOVA-IOT habilitadas'],['ping -t durante el roaming','Continúa; como mucho 1 paquete perdido; misma IP']],
 trouble:[['El cliente conecta pero no recibe IP','Revisa el Primary DHCP Server de la interfaz dinámica y que la VLAN esté permitida en el trunk de la WLC (show interfaces trunk).'],['La laptop no ve el SSID','¿La WLAN está Enabled? ¿La laptop tiene tarjeta inalámbrica WPC300N? ¿Está dentro del alcance de algún AP?']],

  {q:'¿Qué une a un SSID con una VLAN en la WLC?', o:['El canal','La interfaz dinámica asignada a la WLAN','El AP','El cable'], a:1, e:'La WLAN apunta a una interfaz dinámica, y esa interfaz está en una VLAN.'},

 ],

{id:'radius', et:3, title:'WPA2-Enterprise, 802.1X y RADIUS', focus:['cli','ap1','wlc','swc','r','rad'], rubk:'seg',
 prob:'Problema 1: una sola clave WPA2-PSK compartida provoca fuga de información. Si un empleado se va, se lleva la clave.',
 rub:'Seguridad (25 %): "WPA2-Enterprise con servidor RADIUS/AAA funcional"',
 theory:`
<div class="tbl"><table><thead><tr><th>Protocolo</th><th>Cifrado</th><th>Estado</th></tr></thead><tbody>
<tr><td>WEP</td><td>RC4</td><td>Roto, nunca usar</td></tr><tr><td>WPA</td><td>TKIP</td><td>Obsoleto</td></tr>
<tr><td><b>WPA2</b></td><td><b>AES-CCMP</b></td><td>Estándar actual (el que usamos)</td></tr><tr><td>WPA3</td><td>AES + SAE</td><td>El más nuevo; PT no lo soporta completo</td></tr></tbody></table></div>
<h3>Personal y Enterprise</h3>
<ul><li><b>WPA2-Personal (PSK):</b> una clave para todos. Si alguien se va, hay que cambiarla en todos los equipos.</li>
<li><b>WPA2-Enterprise (802.1X):</b> cada persona tiene su usuario y contraseña, validados por un servidor. Para quitarle el acceso a alguien, borras su usuario.</li></ul>
<h3>Los 3 actores de 802.1X</h3>
<div class="tbl"><table><thead><tr><th>Rol</th><th>Analogía</th><th>En tu red</th></tr></thead><tbody>
<tr><td><b>Suplicante</b></td><td>La persona que quiere entrar</td><td>La laptop</td></tr>
<tr><td><b>Autenticador</b></td><td>El guardia de la puerta</td><td>La <b>WLC</b></td></tr>
<tr><td><b>Servidor de autenticación</b></td><td>La oficina con la lista de empleados</td><td>El <b>RADIUS</b></td></tr></tbody></table></div>
<p>El guardia no decide: pregunta a la oficina y obedece.</p>
<h3>El proceso</h3>
<ol><li>La laptop se asocia a INNOVA-CORP.</li>
<li>La WLC le pide su identidad con <b>EAP</b> (entre laptop y WLC viaja como <b>EAPOL</b>).</li>
<li>La WLC lo empaqueta en un <b>RADIUS Access-Request</b> hacia 192.168.3.10, puerto <b>UDP 1812</b>, firmado con el <b>shared secret</b>.</li>
<li>El RADIUS revisa la cuenta y responde <b>Access-Accept</b> o <b>Access-Reject</b>.</li>
<li>Se derivan las llaves (<b>4-way handshake</b>) y todo viaja cifrado con <b>AES</b>.</li>
<li>La laptop pide IP por DHCP en la VLAN 10.</li></ol>
<h3>AAA</h3>
<p><b>Authentication</b> (¿quién eres?), <b>Authorization</b> (¿qué puedes hacer?), <b>Accounting</b> (¿qué hiciste?). RADIUS usa 1812 para autenticación y 1813 para accounting. TACACS+ (TCP 49) es la alternativa de Cisco para administrar equipos.</p>
<p>Un detalle que el docente suele preguntar: en el servidor RADIUS, el <b>cliente</b> es la <b>WLC</b> (192.168.0.10), no la laptop, porque es la WLC la que le hace la pregunta.</p>`,
 steps:[
  {t:'SRV-RADIUS → Services → <b>AAA</b>: Service On. Network Configuration: Client Name <code>WLC</code>, Client IP <code>192.168.0.10</code>, Secret <code>RadiusInnova2026</code>, ServerType <b>Radius</b> → Add.'},
  {t:'User Setup: agrega <code>jlopez</code>/<code>Corp2026</code>, <code>mgarcia</code>/<code>Corp2026</code>, <code>almacen01</code>/<code>Corp2026</code>.'},
  {t:'WLC → <b>Security → AAA → RADIUS → Authentication → New</b>: Server IP <code>192.168.3.10</code>, Shared Secret <code>RadiusInnova2026</code> (exactamente igual), Port 1812, Enabled. Apply.'},
  {t:'WLC → WLANs → Create New: <code>INNOVA-CORP</code>, ID 1, Interface <b>CORP</b>, Enabled. Security → Layer 2: WPA+WPA2, WPA2, AES, Auth Key Mgmt <b>802.1X</b>. Security → AAA Servers: Server 1 = 192.168.3.10. Apply.'},
  {t:'LAP-EMPLEADO-1 y LAP-EMPLEADO-2 (con WPC300N): SSID <code>INNOVA-CORP</code>, Authentication <b>WPA2</b> (no WPA2-PSK), User ID <code>jlopez</code> / <code>mgarcia</code>, Password <code>Corp2026</code>, AES. IP por DHCP → 192.168.1.x.'},
  {t:'TAB-ALMACEN: igual, con <code>almacen01</code>. Colócala cerca de AP-2 o AP-3.'},
  {t:'Prueba la falla: cambia la contraseña de LAP-EMPLEADO-2 a <code>xxxx</code>. No debe conectar. Regrésala. Toma ambas capturas.'},
  {t:'Simulation Mode con filtro <b>RADIUS</b>: reconecta una laptop y observa Access-Request y Access-Accept. Repite el roaming de la lección 11 con LAP-EMPLEADO-1 haciendo <code>ping -t 192.168.3.12</code>. Guarda.'}
 ],
 verify:[['LAP-EMPLEADO-1> ipconfig','192.168.1.x'],['Contraseña incorrecta','No conecta'],['LAP-EMPLEADO-1> ping 192.168.3.12','Reply (empleados sí llegan a servidores)']],
 trouble:[['La laptop no conecta con la contraseña correcta','Compara el secret en WLC y servidor (mayúsculas incluidas). Client IP en el servidor = 192.168.0.10. Servicio AAA On. Usuario bien escrito. ¿La WLC llega al RADIUS? (ping desde PC-ADMIN a 192.168.3.10).']],
 quiz:[
  {q:'En 802.1X, ¿qué rol tiene la WLC?', o:['Suplicante','Autenticador','Servidor de autenticación','Cliente DHCP'], a:1, e:'La WLC es el autenticador: pide credenciales y las reenvía al RADIUS.'},
  {q:'En el servidor RADIUS, ¿qué IP va como "Client IP"?', o:['La de la laptop','192.168.0.10 (la WLC)','192.168.3.1 (el router)','La del AP'], a:1, e:'El cliente RADIUS es quien le pregunta: la WLC.'},
  {q:'¿Qué pasa si se cae el servidor RADIUS?', o:['Nadie de ninguna red se conecta','Los empleados no pueden autenticarse; invitados e IoT (PSK) siguen funcionando','Solo fallan los invitados','Nada'], a:1, e:'Solo INNOVA-CORP depende del RADIUS. En producción se pone un RADIUS secundario.'},
  {q:'¿Puerto de autenticación de RADIUS?', o:['TCP 49','UDP 1812','UDP 5246','TCP 443'], a:1, e:'1812 autenticación, 1813 accounting. TCP 49 es TACACS+.'},
  {q:'Principal ventaja de Enterprise sobre PSK para la empresa:', o:['Más velocidad','Cada empleado tiene su cuenta y se puede revocar a uno sin afectar al resto','No necesita servidor','Usa 5 GHz'], a:1, e:'Resuelve la fuga de información de la clave compartida.'}
 ],
 say:'Eliminamos la clave compartida. La laptop es el suplicante, la WLC el autenticador y el servidor RADIUS el servidor de autenticación. La WLC reenvía las credenciales al RADIUS por UDP 1812 con un secreto compartido; si las acepta, se cifra con AES. Si un empleado deja la empresa, solo se borra su usuario.',
 links:[['acl','Los empleados ya están seguros; ahora encerramos a los invitados'],['ssids','El roaming también funciona con 802.1X']]
},

{id:'acl', et:3, title:'Aislar a los invitados con una ACL', focus:['cli','wlc','swc','r','cen'], rubk:'seg',
 prob:'Problema 2: los clientes y proveedores usan la misma red que accede a los servidores internos.',
 rub:'Seguridad (25 %): "la red de Invitados está totalmente aislada por ACL"',
 theory:`
<p>Una <b>ACL</b> (Access Control List) es una lista de reglas permitir/denegar que el router aplica a los paquetes.</p>
<div class="analogy">Un guardia con una lista. Lee de arriba hacia abajo; en cuanto una línea coincide con la persona, hace lo que dice esa línea y deja de leer. Si nadie en la lista coincide, no pasa (deny implícito).</div>
<ol><li>Se lee <b>de arriba hacia abajo</b>.</li><li>La <b>primera coincidencia</b> decide.</li><li>Al final hay un <b>deny any implícito</b>.</li></ol>
<h3>Tipos y ubicación</h3>
<ul><li><b>Estándar:</b> solo mira el origen. Va <b>cerca del destino</b>.</li>
<li><b>Extendida:</b> mira origen, destino, protocolo y puerto. Va <b>cerca del origen</b>. Es la que usamos.</li>
<li><b>in</b> revisa lo que entra al router por esa interfaz; <b>out</b>, lo que sale.</li></ul>
<h3>Wildcard</h3>
<p>Es la máscara al revés: 0 = debe coincidir, 1 = no importa. Se calcula como 255.255.255.255 − máscara.</p>
<ul><li>/24 → <code>0.0.0.255</code></li><li>/20 → 255.255.255.255 − 255.255.240.0 = <code>0.0.15.255</code>: cubre de 192.168.0.0 a 192.168.15.255, toda la empresa.</li></ul>
<h3>Tu ACL, línea por línea</h3>
<pre class="code">permit udp any any eq bootps        <span class="cmt">! DHCP (puerto 67). Sin esto, el invitado no tendría IP</span>
permit icmp 192.168.2.0 0.0.0.255 host 192.168.2.1   <span class="cmt">! ping a su gateway, para pruebas</span>
deny ip 192.168.2.0 0.0.0.255 192.168.0.0 0.0.15.255 <span class="cmt">! NADA hacia la red de la empresa</span>
permit ip 192.168.2.0 0.0.0.255 any <span class="cmt">! todo lo demás (Internet)</span></pre>
<p>Se aplica con <code>ip access-group ACL-INVITADOS in</code> en <code>G0/0.20</code>: lo más cerca posible del origen, que son los invitados.</p>
<p><b>¿Y el Internet?</b> Tu .pkt no tiene conexión a Internet: la última línea (<code>permit ip … any</code>) deja listo el acceso para cuando la empresa conecte un proveedor. En la demostración, lo que se prueba es que el invitado <b>no</b> llega a nada interno. Si el docente lo pregunta, explícalo así.</p>
<p><b>El orden importa:</b> si el deny fuera antes que el permit de DHCP, la petición de IP también se bloquearía.</p>
<p>Doble protección: la <b>VLAN 20</b> separa el broadcast y la <b>ACL</b> impide que el router los enrute hacia adentro.</p>
<p>Prueba el <a href="#herramientas" data-goto-tool="acl">simulador de ACL</a>: escribe un paquete y mira qué línea lo atrapa.</p>`,
 steps:[
  {t:'Antes de aplicar la ACL, desde LAP-VISITANTE haz <code>ping 192.168.3.12</code>. ¡Responde! Ese es el problema 2 de la empresa. Toma captura del "antes".'},
  {t:'En R-CORE# pega el bloque 3.', code:'r_acl_inv'},
  {t:'Repite <code>ping 192.168.3.12</code> desde LAP-VISITANTE: ahora falla. Prueba también <code>ping 192.168.1.11</code> y <code>ping 192.168.0.10</code>: fallan. <code>ping 192.168.2.1</code>: responde. Captura del "después".'},
  {t:'En R-CORE: <code>show access-lists</code>. La línea deny muestra "(X match(es))". Captura.'},
  {t:'Desconecta y reconecta el WiFi del visitante: debe seguir obteniendo IP (gracias a la primera línea).'},
  {t:'En el simulador de ACL de la app, prueba los paquetes de ejemplo y explica en voz alta por qué cada uno se permite o se niega. Guarda el .pkt.'}
 ],
 verify:[['Visitante> ping 192.168.3.12','Falla (Destination host unreachable)'],['Visitante> ping 192.168.2.1','Responde'],['R-CORE# show access-lists','Coincidencias en la línea deny']],
 quiz:[
  {q:'¿Qué wildcard cubre toda la red 192.168.0.0/20?', o:['0.0.0.255','0.0.15.255','255.255.240.0','0.0.16.255'], a:1, e:'255.255.255.255 − 255.255.240.0 = 0.0.15.255.'},
  {q:'¿Por qué "permit udp any any eq bootps" va antes del deny?', o:['Por estética','Para que los invitados puedan obtener IP por DHCP; si no, el deny lo bloquearía','Para permitir Internet','Para el RADIUS'], a:1, e:'La primera coincidencia gana. El DHCP debe permitirse antes de bloquear.'},
  {q:'¿Dónde se aplica la ACL extendida de invitados?', o:['Out en G0/1','In en G0/0.20, cerca del origen','En el switch','En la WLC'], a:1, e:'Las extendidas van cerca del origen; "in" filtra lo que entra desde la VLAN de invitados.'},
  {q:'¿Qué pasa con un paquete que no coincide con ninguna línea?', o:['Se permite','Se descarta por el deny implícito','Se reenvía al RADIUS','Se manda a la VLAN nativa'], a:1, e:'Toda ACL termina con un deny any implícito.'}
 ],
 say:'Los invitados están en la VLAN 20 y una ACL extendida, aplicada de entrada en su subinterfaz, niega todo hacia 192.168.0.0/20 con wildcard 0.0.15.255. Solo permite DHCP, ping a su gateway e Internet. La ACL se lee de arriba hacia abajo y termina con un deny implícito.',
 links:[['celular','Usarás otra ACL para proteger el acceso de la flotilla'],['iot','Opcional: otra ACL para encerrar a los sensores']]
},

{id:'iot', et:4, title:'IoT: sensores y reglas automáticas', focus:['sens','ap2','ap3','swa','swc','r','iot','wlc'], rubk:'iot',
 prob:'Problema 3: los insumos médicos requieren control estricto de temperatura y detección de humo, con alertas en tiempo real.',
 rub:'IoT/WSN/WWAN (20 %): "conecta sensores/actuadores al Servidor IoT con reglas automatizadas"',
 theory:`
<ul><li><b>IoT</b> (Internet de las Cosas): objetos con sensores o actuadores conectados a la red.</li>
<li><b>Sensor:</b> <b>mide</b> (temperatura, puerta abierta, humo). Son los sentidos.</li>
<li><b>Actuador:</b> <b>actúa</b> (ventilador, sirena, luz). Son los músculos.</li>
<li><b>Servidor IoT:</b> el cerebro. Recibe lecturas y aplica reglas <b>SI condición ENTONCES acción</b>.</li>
<li><b>WSN</b> (Wireless Sensor Network): red de sensores sin cables. En la industria se usan Zigbee, LoRaWAN, BLE o WiFi; en PT usamos WiFi con el adaptador <b>PT-IOT-NM-1W</b>.</li></ul>
<h3>Tus reglas</h3>
<div class="tbl"><table><thead><tr><th>SI</th><th>ENTONCES</th><th>Por qué</th></tr></thead><tbody>
<tr><td>Temperatura &gt; 25 °C</td><td>Ventilador en High</td><td>Los medicamentos se guardan a temperatura ambiente controlada (15–25 °C)</td></tr>
<tr><td>Temperatura ≤ 25 °C</td><td>Ventilador Off</td><td>Ahorro de energía</td></tr>
<tr><td>Humo detectado</td><td>Sirena On</td><td>Riesgo de incendio</td></tr>
<tr><td>Sin humo</td><td>Sirena Off</td><td>Regresa al estado normal</td></tr>
<tr><td>Puerta abierta</td><td>Luz On</td><td>Indica acceso a la cámara de insumos</td></tr>
<tr><td>Puerta cerrada</td><td>Luz Off</td><td>—</td></tr></tbody></table></div>
<h3>Por qué una VLAN aparte</h3>
<p>Los dispositivos IoT suelen tener poca seguridad. Si alguien compromete un sensor, no debe llegar a laptops ni servidores. Eso es <b>segmentación</b>. Con la ACL-IOT opcional, la VLAN 40 solo habla con el servidor IoT.</p>
<h3>El recorrido</h3>
<pre class="code">Sensor de temperatura → WiFi INNOVA-IOT → AP-2 → CAPWAP → WLC → VLAN 40
 → R-CORE → VLAN 30 → Servidor IoT (evalúa la regla)
 → orden de regreso → … → Ventilador se enciende</pre>`,
 steps:[
  {t:'SRV-IOT → Services → <b>IoT</b>: On.'},
  {t:'PC-ADMIN → Web Browser → <code>http://192.168.3.11</code> → <b>Sign Up Now</b>: usuario <code>admin</code>, contraseña <code>admin2026</code>.'},
  {t:'Coloca en el almacén: Temperature Monitor, Door, Smoke Detector, Ceiling Fan, Siren y Light. Renómbralos TEMP-ALMACEN, PUERTA-ALMACEN, HUMO-ALMACEN, VENTILADOR, SIRENA, LUZ-PUERTA.'},
  {t:'En cada uno: Config → <b>Advanced</b> → I/O Config → Network Adapter: <b>PT-IOT-NM-1W</b>. Luego Config → Wireless0: SSID <code>INNOVA-IOT</code>, WPA2-PSK <code>SensorIoT2026</code>, IP por DHCP (192.168.4.x). Plan B si el WiFi da problemas: déjalos con su puerto Ethernet y conéctalos a SW-ALMACEN Fa0/5–Fa0/10 (VLAN 40).'},
  {t:'En cada uno: Config → Settings → IoT Server: <b>Remote Server</b>, dirección <code>192.168.3.11</code>, usuario <code>admin</code>, contraseña <code>admin2026</code> → Connect. Debe decir Connected.'},
  {t:'En la web del servidor IoT (desde PC-ADMIN): <b>Conditions → Add</b>, crea las 6 reglas de la tabla. Captura de la lista.'},

  {t:'Desde TAB-ALMACEN → navegador → <code>http://192.168.3.11</code>: el almacenista ve el estado. Captura.'},
