 theory:`
<ul><li><b>WWAN:</b> red inalámbrica de área amplia, la que dan los operadores (3G, 4G LTE, 5G).</li>
<li><b>Torre celular (Cell Tower):</b> la antena que da cobertura. En LTE se llama <b>eNodeB</b>.</li>
<li><b>Central Office Server:</b> simula la central del operador (en LTE, el núcleo <b>EPC</b>). Les da IP a los celulares y conecta la red celular con la empresa por su puerto <b>Backbone</b>.</li></ul>
<h3>Recorrido de ida</h3>
<pre class="code">Celular 192.168.6.10
 → radio 4G → TORRE-4G → coaxial → CENTRAL-OFFICE (192.168.5.2)
 → R-CORE G0/1 (192.168.5.1)   <span class="cmt">! aquí la ACL-CELULAR revisa el paquete</span>
 → G0/0.30 → SW-CORE → SRV-CENTRAL 192.168.3.12</pre>
<h3>Recorrido de regreso</h3>
<p>El servidor responde a 192.168.6.10. El router no tiene esa red conectada, así que necesita una <b>ruta estática</b>: <code>ip route 192.168.6.0 255.255.255.0 192.168.5.2</code> ("para llegar a los celulares, entrégaselo al Central Office").</p>
<h3>Comunicación segura</h3>
<ul><li><b>ACL-CELULAR</b> solo permite a los celulares llegar al Servidor Central por HTTPS (443), HTTP (80) y DNS (53), más ping para pruebas. Todo lo demás se niega.</li>
<li><b>HTTPS</b> cifra el contenido.</li>
<li>En una red real se agregaría <b>VPN IPsec</b> o un <b>APN privado</b> del operador.</li></ul>`,
 steps:[
  {t:'CENTRAL-OFFICE → Config → <b>Backbone</b>: IP <code>192.168.5.2</code>, máscara <code>255.255.255.0</code>, gateway <code>192.168.5.1</code>.'},

<div class="tbl"><table><thead><tr><th>Capa</th><th>Pregunta</th><th>Dónde</th></tr></thead><tbody>

const GKEYS = Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
const GRE = new RegExp('(?<![\\wÁÉÍÓÚáéíóúñÑ./-])(' + GKEYS.map(k=>k.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&')).join('|') + ')(?![\\wÁÉÍÓÚáéíóúñÑ-])', 'gi');
function markTerms(root, seen=new Set()){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode(n){
    const p = n.parentElement; if(!p) return NodeFilter.FILTER_REJECT;
    if(p.closest('code,pre,kbd,a,button,h1,h2,h3,label,th,.term,.say,svg,select,textarea,[data-widget]')) return NodeFilter.FILTER_REJECT;
    return /\S/.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }});
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const txt=n.nodeValue; GRE.lastIndex=0; let m, last=0, frag=null;
    while((m=GRE.exec(txt))){
      const key=GKEYS.find(k=>k.toLowerCase()===m[1].toLowerCase());
      if(!key || seen.has(key)) continue;
      // Siglas cortas en mayúsculas: solo si aparecen en mayúsculas
      if(key===key.toUpperCase() && m[1]!==key) continue;
      seen.add(key); frag=frag||document.createDocumentFragment();
      frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
      const b=document.createElement('button'); b.type='button'; b.className='term'; b.dataset.t=key; b.textContent=m[1];
      frag.appendChild(b); last=m.index+m[1].length;
    }
    if(frag){ frag.appendChild(document.createTextNode(txt.slice(last))); n.parentNode.replaceChild(frag,n); }
  });
}

function prog(L){
  const st=S.steps[L.id]||{}, qz=S.quiz[L.id]||{};
  let sd=0; L.steps.forEach((_,i)=>{if(st[i])sd++;});
  let qc=0, qa=0; L.quiz.forEach((q,i)=>{ if(qz[i]!==undefined){qa++; if(qz[i]===q.a) qc++;} });
  const total=L.steps.length+L.quiz.length;
  return {sd, qc, qa, frac:(sd+qc)/total, any:(sd+qa)>0};
}
function ledOf(L){const p=prog(L); return p.frac>=1?'on':(p.any?'mid':'');}

  });
  return h+'</details>';

function orderOf(lid,qi,n){
  // Orden de opciones fijo para cada pregunta, pero distinto entre preguntas.
  let h=2166136261; for(const c of lid+'#'+qi){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); }
  const a=Array.from({length:n},(_,i)=>i);
  for(let i=n-1;i>0;i--){ h=Math.imul(h^(h>>>15),2246822507)>>>0; const j=h%(i+1); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function quizBlock(L,i){
  const q=L.quiz[i]; const ans=(S.quiz[L.id]||{})[i];

    let c=''; if(answered){ if(j===q.a) c='right'; else if(j===ans) c='wrong'; }
    return `<button class="opt ${c}" data-act="ans" data-q="${i}" data-o="${j}" ${answered?'disabled':''}>${esc(o)}</button>`;}).join('')}</div>
    ${answered?`<div class="exp ${ans===q.a?'right':'wrong'}">${ans===q.a?'Correcto. ':'No es esa. '}${esc(q.e)}${ans!==q.a?` <button class="btn sm ghost" data-act="retry" data-q="${i}">Reintentar</button>`:''}</div>`:''}</div>`;
}

const ip2n=s=>{const p=s.trim().split('.').map(Number); if(p.length!==4||p.some(x=>!Number.isInteger(x)||x<0||x>255)) return null; return ((p[0]<<24)>>>0)+(p[1]<<16)+(p[2]<<8)+p[3];};
const n2ip=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
const maskN=pre=>pre===0?0:((0xFFFFFFFF<<(32-pre))>>>0);
const PROJ=[['192.168.0.0',24,'VLAN 99 · Gestión'],['192.168.1.0',24,'VLAN 10 · Corporativo'],['192.168.2.0',24,'VLAN 20 · Invitados'],['192.168.3.0',24,'VLAN 30 · Servidores'],['192.168.4.0',24,'VLAN 40 · IoT'],['192.168.5.0',24,'Enlace R-CORE ↔ Central Office'],['192.168.6.0',24,'Red celular 4G']];
function toolCalc(){

   <dl class="kv" id="cout"></dl></section>
   <section class="card stack" style="gap:12px"><h2>La /20 dividida en 16 /24</h2><p class="muted">Toca una subred para analizarla. Las resaltadas son las que usa tu proyecto.</p>
   <div class="subgrid">${Array.from({length:16},(_,i)=>{const u=PROJ.find(p=>p[0]===`192.168.${i}.0`);return `<button class="sub ${u?'used':''}" data-act="pick-sub" data-i="${i}"><b>.${i}.0</b>${u?esc(u[2].split('·')[0]):'libre'}</button>`;}).join('')}</div></section></div>`;
  ['cip','cpre'].forEach(id=>$('#'+id).addEventListener('input',calc)); calc();

function calc(){
  const ip=ip2n($('#cip').value), pre=parseInt($('#cpre').value,10), out=$('#cout');
  if(ip===null||!(pre>=0&&pre<=32)){ out.innerHTML='<dt>Error</dt><dd>Escribe una IP válida (4 números de 0 a 255) y un prefijo de 0 a 32.</dd>'; return; }
  const m=maskN(pre), net=(ip&m)>>>0, bc=(net|(~m>>>0))>>>0, hosts=pre>=31?0:Math.pow(2,32-pre)-2;
  const bin=n2ip(m).split('.').map(o=>(+o).toString(2).padStart(8,'0')).join('.');
  const inProj=PROJ.find(p=>{const pm=maskN(p[1]);return ((ip&pm)>>>0)===ip2n(p[0]);});
  const inCo=((ip&maskN(20))>>>0)===ip2n('192.168.0.0');
  out.innerHTML=`<dt>Red</dt><dd>${n2ip(net)}/${pre}</dd><dt>Máscara</dt><dd>${n2ip(m)}</dd><dt>En binario</dt><dd>${bin}</dd><dt>Wildcard</dt><dd>${n2ip((~m)>>>0)}</dd>
   <dt>Primer host</dt><dd>${pre>=31?'—':n2ip(net+1)}</dd><dt>Último host</dt><dd>${pre>=31?'—':n2ip(bc-1)}</dd><dt>Broadcast</dt><dd>${n2ip(bc)}</dd><dt>Hosts útiles</dt><dd>${hosts.toLocaleString('es-MX')}</dd>
   <dt>En tu proyecto</dt><dd>${inProj?`${inProj[2]} (gateway ${inProj[0].replace(/0$/,'1')})`:(inCo?'Dentro de 192.168.0.0/20, subred libre':'Fuera de la red de la empresa')}</dd>`;
}

  ['aacl','aproto','asrc','adst','aport'].forEach(id=>$('#'+id).addEventListener('input',runAcl));
  runAcl();
}
function inW(ip,[b,w]){ const B=ip2n(b),W=ip2n(w); return ((ip^B)&(~W>>>0))>>>0===0; }
function runAcl(){
  ACLSEL=$('#aacl').value; const A=ACLS[ACLSEL];
  const proto=$('#aproto').value, src=ip2n($('#asrc').value), dst=ip2n($('#adst').value), port=parseInt($('#aport').value,10);
  $('#aname').textContent=ACLSEL; $('#aiface').textContent=`Aplicada en R-CORE ${A.iface}. Se lee de arriba hacia abajo; la primera coincidencia decide.`;
  const v=$('#averdict'), ex=$('#aexp');
  if(src===null||dst===null){ $('#arules').innerHTML=A.rules.map(r=>`<div>${esc(r.txt)}</div>`).join('')+'<div class="muted">(deny any implícito)</div>'; v.className='verdict na'; v.textContent='Escribe IPs válidas.'; ex.textContent=''; return; }
  const entra = src===0 || inW(src,A.src) || (A.extraSrc && inW(src,A.extraSrc));
  let hit=-1;
  if(entra){ for(let i=0;i<A.rules.length;i++){ const r=A.rules[i];
    if(r.p!=='ip' && r.p!==proto) continue;
    if(!inW(src,r.s)||!inW(dst,r.d)) continue;
    if(r.port!==undefined && (proto==='icmp' || port!==r.port)) continue;
    hit=i; break; } }
  $('#arules').innerHTML=A.rules.map((r,i)=>`<div class="${i===hit?'hit '+r.a:'chk'}">${i+1}. ${esc(r.txt)}</div>`).join('')+`<div class="${hit===-1&&entra?'hit deny':'chk'}">(deny any implícito)</div>`;
  if(!entra){ v.className='verdict na'; v.textContent='Esta ACL no revisa este paquete.'; ex.textContent=`El origen no está en la red que entra por ${A.iface.split(' ')[0]}. La ACL solo filtra el tráfico que entra por esa interfaz.`; return; }
  const act=hit===-1?'deny':A.rules[hit].a;
  v.className='verdict '+act; v.textContent=act==='permit'?'PERMITIDO':'DENEGADO';
  ex.textContent=hit===-1?'Ninguna línea coincidió, así que aplica el deny implícito del final.':`Coincide con la línea ${hit+1}. Las líneas de abajo ya no se leen.`;
}

const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function drawTimer(){

  let acc=0; document.querySelectorAll('.seg').forEach((el,i)=>{ const s=SEGS[i][1]; el.classList.toggle('cur',TM.t>=acc&&TM.t<acc+s); el.classList.toggle('past',TM.t>=acc+s); acc+=s; });

}

document.addEventListener('click',e=>{
  const term=e.target.closest('.term'); const pop=document.getElementById('gloss-pop');
  if(term){ showGloss(term); return; } if(!e.target.closest('#gloss-pop')) pop.hidden=true;
  const g=e.target.closest('[data-goto-tool]'); if(g){ TOOL=g.dataset.gotoTool; if(location.hash==='#herramientas'){ e.preventDefault(); renderTools(); } return; }
  const t=e.target.closest('[data-act]'); if(!t) return;
  const act=t.dataset.act;
  if(act==='copy'){ const txt=CFG[t.dataset.key];
    const done=()=>{t.textContent='Copiado'; setTimeout(()=>t.textContent='Copiar',1500);};
    try{ navigator.clipboard.writeText(txt).then(done,()=>selPre(t)); }catch(err){ selPre(t); } return; }
  if(act==='ans'){ const i=+t.dataset.q; (S.quiz[CUR.id] ||= {})[i]=+t.dataset.o; save(); $('#q-'+i).outerHTML=quizBlock(CUR,i); refreshLessonMeta(); return; }
  if(act==='retry'){ const i=+t.dataset.q; delete (S.quiz[CUR.id]||{})[i]; save(); $('#q-'+i).outerHTML=quizBlock(CUR,i); refreshLessonMeta(); return; }
  if(act==='ch-set'){ t.dataset.v.split(',').forEach((v,i)=>$('#ch-ap-'+(i+1)).value=v); drawCh(); return; }
  if(act==='tool'){ TOOL=t.dataset.k; renderTools(); return; }
  if(act==='preset'){ e.preventDefault(); const p=PRESETS[+t.dataset.i]; $('#aacl').value=p[1]; $('#asrc').value=p[2]; $('#adst').value=p[3]; $('#aproto').value=p[4]; $('#aport').value=p[5]; runAcl(); $('#averdict').scrollIntoView({block:'nearest',behavior:'smooth'}); return; }
  if(act==='jnext'){ JS=Math.min(JS+1,JOURNEYS[JI].steps.length-1); drawJ(); return; }
  if(act==='jprev'){ JS=Math.max(JS-1,0); drawJ(); return; }
  if(act==='tstart'){ if(TM.run){ clearInterval(TM.id); TM.run=false; } else { TM.run=true; TM.id=setInterval(()=>{ TM.t++; drawTimer(); if(TM.t>=1200){clearInterval(TM.id);TM.run=false;drawTimer();} },1000); } drawTimer(); return; }
  if(act==='treset'){ clearInterval(TM.id); TM={run:false,t:0,id:null}; drawTimer(); return; }
  if(act==='fc-show'){ FCshow=true; drawFlash(); return; }
  if(act==='fc-skip'){ FC=null; drawFlash(); return; }
  if(act==='fc-ok'){ S.cards[FC]='ok'; save(); FC=null; drawFlash(); return; }
  if(act==='fc-rep'){ S.cards[FC]='rep'; save(); FC=null; drawFlash(); return; }
  if(act==='reset-all'){ $('#resetq').innerHTML=`<div class="exp wrong" style="margin-top:8px">Se borrarán pasos, quizzes, notas y tarjetas de este navegador. <button class="btn sm" data-act="reset-yes">Sí, borrar</button></div>`; return; }
  if(act==='reset-yes'){ S={steps:{},quiz:{},notes:{},cards:{},evid:{}}; save(); renderRubric(); return; }
});

document.addEventListener('change',e=>{

});
document.addEventListener('input',e=>{ const t=e.target; if(t.dataset.act==='notes'){ S.notes[CUR.id]=t.value; save(); } });

function route(){
  const h=(location.hash||'#ruta').slice(1);

  else renderHome();
  const tab=h.startsWith('leccion-')?'leccion':(['herramientas','defensa','rubrica'].includes(h)?h:'ruta');
  document.querySelectorAll('nav.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.tab===tab));
  const nx=CUR||LESSONS.find(l=>ledOf(l)!=='on')||LESSONS[0]; $('nav.tabs a[data-tab="leccion"]').href='#leccion-'+nx.id;
  window.scrollTo(0,0);
}
